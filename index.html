<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Pareceres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1C2B45;
    --ink-soft:#5B6478;
    --paper:#F3EFE0;
    --paper-raised:#FBF8EE;
    --line:#DCD4BE;
    --brass:#A9752E;
    --brass-dark:#7C551E;
    --brass-light:#F1E3C6;
    --red:#9C3B34;
    --red-light:#F2E0DC;
    --green:#52734F;
    --green-light:#E4EADD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    padding:2.5rem 1.5rem 4rem;
    min-height:100vh;
    overflow-x:hidden;
  }
  .wrap{max-width:1360px;margin:0 auto;min-width:0;}

  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:1.5rem;
    padding-bottom:1.75rem;
    border-bottom:1px solid var(--line);
    margin-bottom:1.5rem;
  }
  .header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    letter-spacing:-0.01em;
    margin:0 0 0.35rem;
  }
  .header p{margin:0;color:var(--ink-soft);font-size:0.95rem;max-width:42ch;}
  .seal{
    width:190px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .seal img, .seal svg{width:100%;height:auto;display:block;}
  @media (max-width:640px){ .seal{ width:130px; } }

  .tabs{display:flex;gap:0.4rem;margin-bottom:1.5rem;border-bottom:1px solid var(--line);}
  .tab{
    background:none;border:none;
    padding:0.6rem 0.2rem;
    margin-right:1.3rem;
    font-size:0.92rem;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:500;}

  .alert-card{
    background:var(--brass-light);
    border:1px solid var(--brass);
    border-radius:10px;
    padding:0.9rem 1.1rem;
    margin-bottom:0.7rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
  }
  .alert-card p{margin:0;font-size:0.88rem;color:var(--brass-dark);flex:1;min-width:220px;}
  .alert-actions{display:flex;gap:0.5rem;flex-shrink:0;}
  .flash{
    background:var(--green-light);
    border:1px solid var(--green);
    color:var(--green);
    border-radius:10px;
    padding:0.7rem 1.1rem;
    font-size:0.85rem;
    margin-bottom:1rem;
  }

  .actions{display:flex;gap:0.7rem;margin-bottom:1.5rem;flex-wrap:wrap;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:0.6rem 1.1rem;border-radius:7px;font-size:0.85rem;font-weight:500;}
  .btn:hover{background:#28395a;}
  .btn-sm{padding:0.4rem 0.75rem;font-size:0.8rem;border-radius:6px;}
  .btn-ghost{border:1px solid var(--line);background:transparent;color:var(--ink);padding:0.6rem 1.1rem;border-radius:7px;font-size:0.85rem;}
  .btn-ghost:hover{border-color:var(--brass);color:var(--brass-dark);}
  .btn-ghost.btn-sm{padding:0.4rem 0.75rem;}

  .filters{display:flex;gap:0.4rem;margin-bottom:1rem;flex-wrap:wrap;}
  .filter-chip{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:0.35rem 0.8rem;border-radius:20px;font-size:0.8rem;}
  .filter-chip.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}

  .ledger{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;min-width:900px;}
  thead th{text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-soft);font-weight:500;padding:0.75rem 0.8rem;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:0.8rem 0.8rem;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(169,117,46,0.05);}
  .col-num{font-family:'IBM Plex Mono', monospace;color:var(--ink-soft);white-space:nowrap;}
  .col-title{font-weight:500;}
  .col-title .sub{display:block;font-size:0.76rem;font-weight:400;color:var(--ink-soft);margin-top:2px;}
  .muted{color:var(--ink-soft);}
  .col-date{font-family:'IBM Plex Mono', monospace;font-size:0.8rem;color:var(--ink-soft);white-space:nowrap;}
  .row-actions{display:flex;gap:0.4rem;white-space:nowrap;}
  .icon-btn{border:1px solid var(--line);background:transparent;width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:0.8rem;}
  .icon-btn:hover{border-color:var(--ink);color:var(--ink);}
  .icon-btn.danger:hover{border-color:var(--red);color:var(--red);}

  .stamp{display:inline-block;font-family:'IBM Plex Mono', monospace;font-size:0.66rem;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;padding:0.26rem 0.5rem;border:1.5px solid currentColor;border-radius:4px;transform:rotate(-2deg);white-space:nowrap;}
  .stamp.em-dia{color:var(--green);}
  .stamp.atrasado{color:var(--red);}
  .stamp.concluido{color:var(--brass-dark);}
  .badge-fase{font-size:0.7rem;color:var(--ink-soft);display:block;margin-top:2px;}

  .empty-state{text-align:center;padding:3.5rem 1.5rem;color:var(--ink-soft);}
  .empty-state p{margin:0.3rem 0 0;font-size:0.9rem;}
  .empty-state .big{font-family:'Fraunces', serif;font-size:1.15rem;color:var(--ink);}

  .overlay{position:fixed;inset:0;background:rgba(28,43,69,0.45);display:none;align-items:flex-start;justify-content:center;padding:3rem 1.5rem;z-index:10;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;padding:1.75rem;}
  .modal.modal-wide{max-width:820px;}
  .modal h2{font-family:'Fraunces', serif;font-weight:600;font-size:1.3rem;margin:0 0 1.2rem;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-size:0.78rem;color:var(--ink-soft);margin-bottom:0.35rem;}
  .field input, .field select, .field textarea{width:100%;padding:0.55rem 0.7rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:0.88rem;}
  .field textarea{resize:vertical;min-height:110px;font-family:'IBM Plex Mono', monospace;font-size:0.8rem;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .field-error{color:var(--red);font-size:0.78rem;margin-top:0.3rem;}
  .field-hint{color:var(--ink-soft);font-size:0.76rem;margin-top:0.3rem;}
  .modal-actions{display:flex;justify-content:flex-end;gap:0.6rem;margin-top:1.4rem;flex-wrap:wrap;}

  .parecerista-row{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0.55rem 0;border-bottom:1px solid var(--line);font-size:0.87rem;}
  .parecerista-row:last-of-type{border-bottom:none;}
  .parecerista-row .name{display:flex;flex-direction:column;}
  .parecerista-row .name small{color:var(--ink-soft);font-size:0.74rem;}
  .toggle{width:34px;height:19px;border-radius:20px;background:var(--line);border:none;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--paper-raised);transition:left 0.15s ease;}
  .toggle.on{background:var(--green);}
  .toggle.on::after{left:17px;}
  .add-parecerista{display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap;}
  .add-parecerista input{flex:1;min-width:120px;}
  .list-scroll{max-height:320px;overflow-y:auto;padding-right:4px;}

  .mini-table-wrap{overflow-x:auto;}
  .mini-table{width:100%;border-collapse:collapse;font-size:0.8rem;min-width:640px;}
  .mini-table th{text-align:left;font-size:0.66rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:500;padding:0.4rem 0.5rem;border-bottom:1px solid var(--line);white-space:nowrap;}
  .mini-table td{padding:0.45rem 0.5rem;border-bottom:1px solid var(--line);vertical-align:middle;}
  .mini-table tr:last-child td{border-bottom:none;}
  .mini-table input, .mini-table select{width:100%;padding:0.35rem 0.45rem;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:0.78rem;}
  .add-form-grid{display:grid;grid-template-columns:1.3fr 1fr 1.3fr 1.2fr 1fr;gap:0.5rem;align-items:end;margin-top:1rem;}
  .add-form-grid .field{margin-bottom:0;}
  .add-form-grid .field label{font-size:0.7rem;}
  .add-form-toggles{display:flex;align-items:center;gap:1.6rem;margin-top:0.9rem;flex-wrap:wrap;}
  .add-form-toggles label{display:flex;align-items:center;gap:0.5rem;font-size:0.83rem;color:var(--ink-soft);margin:0;cursor:pointer;}
  @media (max-width:700px){ .add-form-grid{grid-template-columns:1fr 1fr;} }

  .modal-tabs{display:flex;gap:1rem;margin-bottom:1.1rem;border-bottom:1px solid var(--line);}
  .modal-tab{background:none;border:none;padding:0.4rem 0;font-size:0.85rem;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;}
  .modal-tab.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:500;}

  .import-preview{border:1px solid var(--line);border-radius:8px;padding:0.7rem 0.9rem;margin:0.8rem 0;font-size:0.82rem;background:var(--paper);max-height:180px;overflow-y:auto;}
  .import-preview div{padding:0.2rem 0;}

  .dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;min-width:0;}
  .metric-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;}
  .metric-card .num{font-family:'Fraunces', serif;font-size:1.7rem;font-weight:600;}
  .metric-card .lbl{font-size:0.78rem;color:var(--ink-soft);margin-top:0.2rem;}
  .metric-card.red .num{color:var(--red);}
  .metric-card.green .num{color:var(--green);}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;min-width:0;}
  .chart-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;min-width:0;max-width:100%;overflow:hidden;}
  .chart-card h3{font-family:'Fraunces', serif;font-size:1rem;font-weight:600;margin:0 0 0.8rem;}
  .chart-card canvas{max-height:220px;}
  .rank-table-wrap{overflow-x:auto;max-width:100%;}
  .rank-table{width:100%;border-collapse:collapse;font-size:0.83rem;}
  .rank-table th{text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);padding:0.5rem 0.4rem;border-bottom:1px solid var(--line);white-space:nowrap;}
  .rank-table td{padding:0.55rem 0.4rem;border-bottom:1px solid var(--line);}
  .rank-table tr:last-child td{border-bottom:none;}

  .loading{text-align:center;padding:3rem;color:var(--ink-soft);font-size:0.9rem;}

  .footer{
    margin-top:2.5rem;
    padding-top:1.25rem;
    border-top:1px solid var(--line);
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.74rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .footer strong{color:var(--ink);font-weight:500;}
  .footer span{margin:0 0.4rem;color:var(--line);}

  @media (max-width:760px){
    .dash-grid{grid-template-columns:1fr;}
    .chart-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Carregando registro…</div>
</div>

<script>
const STORAGE_KEY = 'controle-pareceres-estado-v2';

const CATEGORIAS_PARECER = [
  { id:'iniciacao_cientifica', label:'Iniciação científica' },
  { id:'pos_doutorado', label:'Pós-doutorado' },
  { id:'pesquisador_colaborador', label:'Pesquisador colaborador' },
  { id:'colaborador_academico', label:'Colaborador acadêmico' },
  { id:'outros', label:'Outros' }
];

const TIPOS_PARECER = {
  iniciacao_cientifica: ['Inicial', 'Avaliação de relatório parcial', 'Avaliação de relatório final'],
  pos_doutorado: ['Inicial', 'Prorrogação', 'Antecipação', 'Avaliação do relatório', 'Anuência do departamento - inicial', 'Anuência do departamento - relatório'],
  pesquisador_colaborador: ['Inicial', 'Prorrogação', 'Antecipação', 'Avaliação do relatório', 'Anuência do departamento - inicial', 'Anuência do departamento - relatório'],
  colaborador_academico: ['Inicial'],
  outros: []
};

// Tipos de parecer que não têm um parecerista individual associado — o prazo conta
// normalmente (14 + 7 dias), mas não há indicação/sugestão de pessoa responsável.
const TIPOS_SEM_PARECERISTA = ['Anuência do departamento - inicial', 'Anuência do departamento - relatório'];

const PARECERISTA_CATEGORIAS = ['Docente','Pós-doutorando','Pesquisador colaborador','Externo'];

const MODALIDADES_BOLSA = ['PIBIC', 'PIBITI', 'PIBIC Cota', 'PIBIC-EM'];
const MODALIDADES_COM_CATEGORIA = ['PIBIC', 'PIBITI'];
const CATEGORIAS_BOLSA = ['A', 'B', 'C', 'D', 'E'];

function modalidadeTemCategoria(m){
  return MODALIDADES_COM_CATEGORIA.includes(m);
}

const TEMPLATE_EMAIL_PADRAO_ANTIGO =
`Prezado(a) {parecerista},

O prazo de 14 dias para emissão do parecer referente ao processo {processo} (categoria: {categoria}) foi encerrado sem manifestação registrada.

Solicito a emissão do parecer no prazo adicional de mais 7 dias (novo prazo final: {novo_prazo}).

Atenciosamente,`;

const TEMPLATE_EMAIL_PADRAO_V2 =
`Prezado(a) parecerista: {parecerista},

O prazo de 14 dias para emissão do parecer referente ao processo {processo} (categoria: {categoria} - tipo de parecer {tipo}) foi encerrado sem manifestação registrada.

Solicitamos a emissão do parecer no prazo adicional de mais 7 dias (novo prazo final: {novo_prazo}).

Atenciosamente,
Comissão de Pesquisa e Inovação
FZEA/USP`;

const TEMPLATE_EMAIL_PADRAO =
`Prezado(a) parecerista: {parecerista},

O prazo de 14 dias para emissão do parecer referente ao processo {processo} (categoria: {categoria} - tipo de parecer {tipo}) foi encerrado sem manifestação registrada.

As orientações para emissão do parecer foram enviadas no email original do pedido.

Solicitamos a emissão do parecer no prazo adicional de mais 7 dias (novo prazo final: {novo_prazo}).

Na impossibilidade de atender à demanda, solicitamos que envie sua justificativa para cpqfzea@usp.br.

Atenciosamente,
Comissão de Pesquisa e Inovação
FZEA/USP`;

let state = null;
let filtro = 'todos';
let filtroTexto = '';
let ordenacao = { coluna: null, direcao: 'asc' };
let filtroTextoReciprocidade = '';
let ordenacaoReciprocidade = { coluna: null, direcao: 'asc' };
let modalidadeGraficoBolsas = 'PIBIC';
let abaAtual = 'pareceres';
let flashMsg = null;
let chartInstances = {};

function defaultState(){
  return {
    pareceristas: [],
    pareceres: [],
    proximoNumero: 1,
    emailTemplate: TEMPLATE_EMAIL_PADRAO,
    gruposDepartamentos: [],
    gruposConflito: [],
    departamentosExtras: ['ADM'],
    feriadosExtras: [],
    bolsas: [],
    atualizadoEm: null
  };
}

/* Armazenamento: usa window.storage quando disponível (visualização dentro do chat);
   caso contrário (arquivo aberto direto no navegador), usa localStorage. */
async function storageGetCompat(key){
  if(window.storage){
    try{ return await window.storage.get(key); }catch(e){ /* cai para localStorage */ }
  }
  try{
    const v = localStorage.getItem(key);
    return v ? { key, value: v } : null;
  }catch(e){ return null; }
}
async function storageSetCompat(key, value){
  if(window.storage){
    try{ return await window.storage.set(key, value); }catch(e){ /* cai para localStorage */ }
  }
  try{ localStorage.setItem(key, value); return { key, value }; }catch(e){ return null; }
}

async function loadState(){
  try{
    const res = await storageGetCompat(STORAGE_KEY);
    state = res ? JSON.parse(res.value) : defaultState();
    if(!state.emailTemplate) state.emailTemplate = TEMPLATE_EMAIL_PADRAO;
    if(state.emailTemplate === TEMPLATE_EMAIL_PADRAO_ANTIGO) state.emailTemplate = TEMPLATE_EMAIL_PADRAO;
    if(state.emailTemplate === TEMPLATE_EMAIL_PADRAO_V2) state.emailTemplate = TEMPLATE_EMAIL_PADRAO;
    if(!state.gruposDepartamentos) state.gruposDepartamentos = [];
    if(!state.gruposConflito) state.gruposConflito = [];
    if(!state.departamentosExtras) state.departamentosExtras = [];
    if(!state.feriadosExtras) state.feriadosExtras = [];
    if(!state.bolsas) state.bolsas = [];
    if(!state.departamentosExtras.some(d => normaliza(d)==='adm')) state.departamentosExtras.push('ADM');
    padronizarGrafiaDepartamentosExistentes();
    ordenarPareceristasAlfabeticamente();
  }catch(e){
    state = defaultState();
  }
  carregarSyncConfig();
  render();
  verificarBackupRemotoMaisRecente();
}

async function saveState(semSincronizar){
  state.atualizadoEm = new Date().toISOString();
  try{
    await storageSetCompat(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Falha ao salvar', e);
  }
  if(!semSincronizar) agendarSincronizacao();
}

/* ---------- Sincronização remota (GitHub Gist / VPS) ---------- */

const SYNC_CONFIG_KEY = 'controle-pareceres-sync-config';

function defaultSyncConfig(){
  return {
    github: { token:'', gistId:'', ativo:false },
    vps: { url:'', token:'', ativo:false }
  };
}

let syncConfig = defaultSyncConfig();
let syncStatus = '';
let syncTimer = null;
let conflitoRemoto = null;

function carregarSyncConfig(){
  try{
    const v = localStorage.getItem(SYNC_CONFIG_KEY);
    if(v) syncConfig = Object.assign(defaultSyncConfig(), JSON.parse(v));
  }catch(e){ syncConfig = defaultSyncConfig(); }
}
function salvarSyncConfig(){
  try{ localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig)); }catch(e){}
}

function sincronizacaoAtiva(){
  return (syncConfig.github.ativo && syncConfig.github.token) || (syncConfig.vps.ativo && syncConfig.vps.url);
}

function agendarSincronizacao(){
  if(!sincronizacaoAtiva()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(executarSincronizacao, 2000);
}

async function executarSincronizacao(){
  const tarefas = [];
  if(syncConfig.github.ativo && syncConfig.github.token) tarefas.push(backupGitHub());
  if(syncConfig.vps.ativo && syncConfig.vps.url) tarefas.push(backupVPS());
  if(tarefas.length===0) return;
  syncStatus = 'Sincronizando…';
  atualizarIndicadorSync();
  try{
    await Promise.all(tarefas);
    syncStatus = `Backup sincronizado às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){
    syncStatus = `Falha na sincronização: ${e.message}`;
  }
  atualizarIndicadorSync();
}

function atualizarIndicadorSync(){
  const el = document.getElementById('sync-indicator');
  if(el) el.textContent = syncStatus;
}

async function githubRequest(path, options){
  options = options || {};
  const headers = Object.assign({
    'Authorization': `token ${syncConfig.github.token}`,
    'Accept': 'application/vnd.github+json'
  }, options.headers || {});
  const res = await fetch(`https://api.github.com${path}`, Object.assign({}, options, { headers }));
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error(`GitHub ${res.status}: ${txt.slice(0,150)}`);
  }
  return res.json();
}

async function backupGitHub(){
  const conteudo = JSON.stringify(state, null, 2);
  const payload = { description:'Backup — Controle de Pareceres', public:false, files:{ 'controle-pareceres-backup.json': { content: conteudo } } };
  if(syncConfig.github.gistId){
    await githubRequest(`/gists/${syncConfig.github.gistId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  } else {
    const criado = await githubRequest('/gists', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    syncConfig.github.gistId = criado.id;
    salvarSyncConfig();
  }
}

async function verificarBackupRemotoMaisRecente(){

function importarArquivo(file){

  reader.onload = (ev) => {

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(3,'0'); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

const MESES_POR_EXTENSO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function fmtDataPorExtenso(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return `${d.getDate()} de ${MESES_POR_EXTENSO[d.getMonth()]} de ${d.getFullYear()}`;
}
function addDays(iso, days){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+Number(days)); return d.toISOString().slice(0,10); }
function todayIso(){ return new Date().toISOString().slice(0,10); }
function diffDays(iso){ const d = new Date(iso+'T00:00:00'); const t = new Date(todayIso()+'T00:00:00'); return Math.round((d-t)/86400000); }

/* ---------- Dias úteis e feriados ---------- */

function pascoaIso(ano){
  const a = ano % 19, b = Math.floor(ano/100), c = ano % 100, d = Math.floor(b/4), e = b % 4;
  const f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const mes = Math.floor((h+l-7*m+114)/31);
  const dia = ((h+l-7*m+114)%31)+1;
  return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}

function feriadosNacionaisDoAno(ano){
  const pascoa = pascoaIso(ano);
  return [
    `${ano}-01-01`,             // confraternização universal
    addDays(pascoa, -47),       // carnaval (terça-feira)
    addDays(pascoa, -2),        // sexta-feira santa
    `${ano}-04-21`,             // tiradentes
    `${ano}-05-01`,             // dia do trabalho
    addDays(pascoa, 60),        // corpus christi
    `${ano}-07-09`,             // revolução constitucionalista (SP)
    `${ano}-09-07`,             // independência
    `${ano}-10-12`,             // nossa senhora aparecida
    `${ano}-11-02`,             // finados
    `${ano}-11-15`,             // proclamação da república
    `${ano}-11-20`,             // consciência negra
    `${ano}-12-25`              // natal
  ];
}

function todosFeriadosDoAno(ano){
  const set = new Set(feriadosNacionaisDoAno(ano));
  (state.feriadosExtras||[]).forEach(f=>{ if(f.data) set.add(f.data); });
  return set;
}

function ehDiaUtil(iso){
  const d = new Date(iso+'T00:00:00');
  const diaSemana = d.getDay(); // 0=domingo, 6=sábado
  if(diaSemana===0 || diaSemana===6) return false;
  const ano = Number(iso.slice(0,4));
  return !todosFeriadosDoAno(ano).has(iso);
}

function proximoDiaUtil(iso){
  let atual = iso;
  let tentativas = 0;
  while(!ehDiaUtil(atual) && tentativas < 30){
    atual = addDays(atual, 1);
    tentativas++;
  }
  return atual;
}

function calcularPrazo(dataBase, dias){
  return proximoDiaUtil(addDays(dataBase, dias));
}
function normaliza(str){ return String(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }
function labelCategoria(p){ const c = CATEGORIAS_PARECER.find(x=>x.id===p.categoriaParecer); const base = c ? c.label : p.categoriaParecer; return p.categoriaParecer==='outros' && p.categoriaParecerOutros ? p.categoriaParecerOutros : base; }
function numeroProcesso(p){ return `${p.processoAno}/${p.processoCodigo}`; }

function parceristasAtivos(){ return state.pareceristas.filter(p=>p.ativo).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'})); }

function parceristaAtualId(parecer){
  const at = parecer.atribuicoes;
  return at && at.length ? at[at.length-1].parceristaId : null;
}

function parceristaAnteriorDoProcesso(ano, codigo, categoria){
  if(!ano || !codigo || !categoria) return null;
  const candidatos = state.pareceres
    .filter(p => p.processoAno === ano && p.processoCodigo === codigo && p.categoriaParecer === categoria && parceristaAtualId(p))
    .sort((a,b) => {
      const da = a.dataSolicitacaoAtual || '';
      const db = b.dataSolicitacaoAtual || '';
      if(da !== db) return db.localeCompare(da); // mais recente primeiro
      return b.numero - a.numero;
    });
  if(!candidatos.length) return null;
  const id = parceristaAtualId(candidatos[0]);
  return id ? (state.pareceristas.find(x=>x.id===id) || null) : null;
}

function nomeParecerista(id){
  const p = state.pareceristas.find(x=>x.id===id);
  return p ? p.nome : '—';
}

function ordenarPareceristasAlfabeticamente(){
  state.pareceristas.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));
}

function descricaoResponsavel(parecer){
  const id = parceristaAtualId(parecer);
  if(id) return nomeParecerista(id);
  return TIPOS_SEM_PARECERISTA.includes(parecer.tipoParecer) ? 'o departamento (anuência)' : '—';
}

function contarAtribuicoes(parceristaId){
  let n = 0;
  state.pareceres.forEach(p=> p.atribuicoes.forEach(a=>{ if(a.parceristaId===parceristaId) n++; }));
  return n;
}

function ultimaAtribuicao(parceristaId){
  let last = null;
  state.pareceres.forEach(p=> p.atribuicoes.forEach(a=>{
    if(a.parceristaId===parceristaId && (!last || a.data > last)) last = a.data;
  }));
  return last;
}

function contarAvaliacoesRecebidas(nUSP){
  if(!nUSP) return 0;
  return state.pareceres.filter(p=> p.autorNUSP && p.autorNUSP===nUSP).length;
}

function saldoReciprocidade(parceristaId){
  // positivo = já avaliou mais do que foi avaliado (deve receber menos trabalho agora)
  // negativo = foi avaliado mais do que avaliou (é a vez de retribuir)
  return contarAtribuicoes(parceristaId) - contarAvaliacoesRecebidas(parceristaId);
}

function grupoDoDepartamento(departamento){
  const n = normaliza(departamento);
  if(!n) return null;
  return (state.gruposDepartamentos||[]).find(grupo => grupo.some(d => normaliza(d)===n)) || null;
}

function conflitantesDe(nUSP){
  if(!nUSP) return [];
  const conjunto = new Set();
  (state.gruposConflito||[]).forEach(grupo=>{
    if(grupo.includes(nUSP)){
      grupo.forEach(id=>{ if(id !== nUSP) conjunto.add(id); });
    }
  });
  return Array.from(conjunto);
}

function sugerirParecerista(departamento, excluirIds, apenasComissao){
  excluirIds = excluirIds || [];
  let ativos = parceristasAtivos().filter(p=> !excluirIds.includes(p.id));
  const naoStaff = ativos.filter(p=> !p.staff);
  ativos = naoStaff.length ? naoStaff : ativos; // evita sugerir staff, exceto se não houver mais ninguém
  if(apenasComissao) ativos = ativos.filter(p=>p.comissaoPesquisa);
  const foraDepto = ativos.filter(p=> normaliza(p.departamento) !== normaliza(departamento));
  const grupo = grupoDoDepartamento(departamento);
  let pool;
  if(grupo){
    const doMesmoGrupo = foraDepto.filter(p=> grupo.some(d=> normaliza(d)===normaliza(p.departamento)));
    pool = doMesmoGrupo.length ? doMesmoGrupo : (foraDepto.length ? foraDepto : ativos);
  } else {
    pool = foraDepto.length ? foraDepto : ativos;
  }
  const withStats = pool.map(p=>({ p, saldo: saldoReciprocidade(p.id), last: ultimaAtribuicao(p.id) }));
  withStats.sort((a,b)=>{
    // prioriza quem foi mais avaliado do que avaliou (saldo mais baixo = deve retribuir)
    if(a.saldo !== b.saldo) return a.saldo - b.saldo;
    if(!a.last && b.last) return -1;
    if(a.last && !b.last) return 1;
    if(!a.last && !b.last) return 0;
    return a.last < b.last ? -1 : (a.last > b.last ? 1 : 0);
  });
  return withStats.length ? withStats[0].p : null;
}

function departamentosConhecidos(){
  const mapa = new Map();
  const considerar = (d) => { if(!d) return; const n = normaliza(d); if(!mapa.has(n)) mapa.set(n, d); };
  state.pareceristas.forEach(p=>considerar(p.departamento));
  (state.departamentosExtras||[]).forEach(considerar);
  return Array.from(mapa.values()).sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
}

// Se o texto digitado bater (ignorando maiúsculas/minúsculas) com um departamento já conhecido,
// usa a grafia oficial já cadastrada, em vez do que foi digitado agora.
function canonicalizarDepartamentoDigitado(valor){
  if(!valor) return valor;
  const conhecidos = departamentosConhecidos();
  const match = conhecidos.find(d => normaliza(d) === normaliza(valor));
  return match || valor.trim();
}

function padronizarGrafiaDepartamentosExistentes(){
  const conhecidos = departamentosConhecidos();
  const mapa = new Map();
  conhecidos.forEach(d => mapa.set(normaliza(d), d));
  let alterados = 0;
  state.pareceres.forEach(p=>{
    if(!p.departamento) return;
    const canonico = mapa.get(normaliza(p.departamento));
    if(canonico && canonico !== p.departamento){ p.departamento = canonico; alterados++; }
  });
  return alterados;
}

function statusParecer(p){
  if(p.dataConclusao) return 'concluido';
  const prazoAtivo = p.faseAtual === 1 ? p.prazoFase1 : p.prazoFase2;
  return diffDays(prazoAtivo) < 0 ? 'atrasado' : 'em_dia';
}

/* ---------- Alertas derivados ---------- */

function alertasPendentes(){
  const alertas = [];
  state.pareceres.forEach(p=>{
    if(p.dataConclusao) return;
    if(p.faseAtual === 1 && diffDays(p.prazoFase1) <= 0){
      alertas.push({ tipo:'fase1', parecer:p });
    } else if(p.faseAtual === 2 && diffDays(p.prazoFase2) <= 0){
      alertas.push({ tipo:'fase2', parecer:p });
    }
  });
  return alertas;
}

function marcarEmitido(parecerId){
  const p = state.pareceres.find(x=>x.id===parecerId);
  if(!p) return;
  p.dataConclusao = todayIso();
  p.historicoDecisoes.push({ data: todayIso(), fase: p.faseAtual, resultado:'emitido', parceristaId: parceristaAtualId(p) });
  flashMsg = `Parecer nº ${pad(p.numero)} marcado como concluído.`;
  saveState(); render();
}

function efetuarReatribuicao(parecerId, novoParceristaId){
  const p = state.pareceres.find(x=>x.id===parecerId);
  if(!p) return;
  const parceristaAnteriorId = parceristaAtualId(p);
  p.atribuicoes.push({ parceristaId: novoParceristaId, data: todayIso() });
  p.dataSolicitacaoAtual = todayIso();
  p.faseAtual = 1;
  p.prazoFase1 = calcularPrazo(todayIso(), 14);
  p.prazoFase2 = null;
  p.emailEnviadoFase1 = false;
  flashMsg = `Parecer nº ${pad(p.numero)} reatribuído de ${escapeHtml(nomeParecerista(parceristaAnteriorId))} para ${escapeHtml(nomeParecerista(novoParceristaId))}. Novo prazo: ${fmtDate(p.prazoFase1)}.`;
  saveState(); render();
}

function abrirModalFase2Nao(parecerId, motivo){
  motivo = motivo || 'prazo_perdido';
  const p = state.pareceres.find(x=>x.id===parecerId);
  if(!p) return;
  const parceristaAnteriorId = parceristaAtualId(p);
  const jaTentados = p.atribuicoes.map(a=>a.parceristaId);
  const conflitantesAutor = conflitantesDe(p.autorNUSP);
  const excluidosParaSugestao = jaTentados.slice();
  if(p.autorNUSP) excluidosParaSugestao.push(p.autorNUSP, ...conflitantesAutor);
  const exigeComissao = jaTentados.length >= 2 && !TIPOS_SEM_PARECERISTA.includes(p.tipoParecer);
  const sugestao = sugerirParecerista(p.departamento, excluidosParaSugestao, exigeComissao);

  const overlay = criarOverlay();
  const grupo = grupoDoDepartamento(p.departamento);
  const opcoes = () => {
    let ativos = parceristasAtivos().filter(x=> x.id !== p.autorNUSP && !conflitantesAutor.includes(x.id));
    if(exigeComissao) ativos = ativos.filter(x=>x.comissaoPesquisa);
    if(ativos.length === 0) return null;
    return ativos.map(x=>{
      let tag = '';
      const mesmoDepto = normaliza(x.departamento)===normaliza(p.departamento);
      if(sugestao && x.id===sugestao.id) tag = ' — sugerido';
      else if(jaTentados.includes(x.id)) tag = ' — já atribuído anteriormente neste parecer';
      else if(mesmoDepto) tag = ' — mesmo departamento';
      else if(grupo && grupo.some(d=>normaliza(d)===normaliza(x.departamento))) tag = ' — departamento relacionado';
      return `<option value="${x.id}" ${sugestao && x.id===sugestao.id ? 'selected':''}>${escapeHtml(x.nome)}${tag}</option>`;
    }).join('');
  };
  const listaOpcoes = opcoes();

  const textoMotivo = motivo === 'declinado_justificado'
    ? `${escapeHtml(nomeParecerista(parceristaAnteriorId))} comunicou que não poderá emitir este parecer.`
    : `O parecer nº ${pad(p.numero)} (processo ${escapeHtml(numeroProcesso(p))}) não foi emitido por ${escapeHtml(nomeParecerista(parceristaAnteriorId))} dentro do prazo final.`;

  const resumoProcesso = `
    <div class="field-row" style="margin-bottom:0.6rem;">
      <div class="field" style="margin-bottom:0;"><label>Processo</label><input type="text" value="${escapeHtml(numeroProcesso(p))}" disabled></div>
      <div class="field" style="margin-bottom:0;"><label>Departamento</label><input type="text" value="${escapeHtml(p.departamento||'—')}" disabled></div>
    </div>
    <div class="field-row" style="margin-bottom:0.6rem;">
      <div class="field" style="margin-bottom:0;"><label>Categoria</label><input type="text" value="${escapeHtml(labelCategoria(p))}" disabled></div>
      <div class="field" style="margin-bottom:0;"><label>Tipo de parecer</label><input type="text" value="${escapeHtml(p.tipoParecer||'—')}" disabled></div>
    </div>
    ${p.autorNUSP ? `<div class="field" style="margin-bottom:0.6rem;"><label>Nº USP do autor avaliado</label><input type="text" value="${escapeHtml(p.autorNUSP)}" disabled></div>` : ''}
  `;

  overlay.innerHTML = `
    <div class="modal">
      <h2>${motivo === 'declinado_justificado' ? 'Parecerista declinou — escolher novo' : 'Trocar parecerista'}</h2>
      <p class="field-hint" style="margin-bottom:1rem;">${textoMotivo}</p>
      ${resumoProcesso}
      <p class="field-hint" style="margin-bottom:1rem;">
        ${sugestao ? `Sugestão automática: <strong>${escapeHtml(sugestao.nome)}</strong> — mas você pode escolher outro nome abaixo.` : 'Não há sugestão automática disponível; escolha manualmente.'}
      </p>
      ${exigeComissao ? `<p class="field-hint" style="color:var(--brass-dark);margin-bottom:1rem;">Este processo já passou por 2 pareceristas sem retorno. A partir de agora, só membros da <strong>comissão de pesquisa</strong> podem ser indicados.</p>` : ''}
      ${listaOpcoes ? `
        <div class="field">
          <label for="f-novo-parecerista-fase2">Novo parecerista</label>
          <select id="f-novo-parecerista-fase2">${listaOpcoes}</select>
          <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;">
            <input id="f-parecerista-fase2-usp" type="text" readonly style="flex:1;background:var(--paper-raised);">
            <button type="button" class="btn-ghost btn-sm" id="copiar-usp-fase2">Copiar nº USP</button>
          </div>
          <p class="field-hint" id="status-usp-fase2"></p>
        </div>
        <div class="field-error" id="err-troca-parecerista"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelar">Cancelar</button>
          <button class="btn" id="confirmar-troca">Confirmar atribuição</button>
        </div>
      ` : `
        <p class="field-error">${exigeComissao ? 'Não há nenhum membro ativo da comissão de pesquisa disponível para reatribuir este parecer (cadastre ou marque alguém como membro da comissão em "Pareceristas").' : 'Não há nenhum parecerista ativo disponível para reatribuir este parecer (cadastre ou reative alguém em "Pareceristas").'}</p>
        <div class="modal-actions"><button class="btn-ghost" id="cancelar">Fechar</button></div>
      `}
    </div>
  `;
  document.getElementById('cancelar').onclick = fecharOverlay;
  if(listaOpcoes){
    const atualizarUspFase2 = () => {
      const id = document.getElementById('f-novo-parecerista-fase2').value;
      const pessoa = state.pareceristas.find(x=>x.id===id);
      document.getElementById('f-parecerista-fase2-usp').value = pessoa ? `${pessoa.nome} — nº USP ${pessoa.id}` : '';
    };
    document.getElementById('f-novo-parecerista-fase2').onchange = atualizarUspFase2;
    atualizarUspFase2();
    document.getElementById('copiar-usp-fase2').onclick = () => {
      const id = document.getElementById('f-novo-parecerista-fase2').value;
      const status = document.getElementById('status-usp-fase2');
      if(!id){ status.textContent = 'Selecione um parecerista primeiro.'; return; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(id)
          .then(()=>{ status.style.color='var(--green)'; status.textContent = `Nº USP ${id} copiado.`; })
          .catch(()=>{ status.style.color='var(--ink-soft)'; status.textContent = 'Não foi possível copiar automaticamente — selecione o texto do campo ao lado e copie manualmente.'; });
      } else {
        const campo = document.getElementById('f-parecerista-fase2-usp');
        campo.removeAttribute('readonly');
        campo.select();
        status.style.color='var(--ink-soft)';
        status.textContent = 'Texto selecionado — use Ctrl+C (ou Cmd+C) para copiar.';
      }
    };
  }
  const btnConfirmar = document.getElementById('confirmar-troca');
  if(btnConfirmar){
    btnConfirmar.onclick = () => {
      const novoId = document.getElementById('f-novo-parecerista-fase2').value;
      if(!novoId){ document.getElementById('err-troca-parecerista').textContent = 'Selecione um parecerista.'; return; }
      p.historicoDecisoes.push({ data: todayIso(), fase: p.faseAtual, resultado:'nao_emitido', motivo, parceristaId: parceristaAnteriorId });
      efetuarReatribuicao(parecerId, novoId);
      fecharOverlay();
    };
  }
}

function preencherTemplate(template, parecer){
  const saudacao = parceristaAtualId(parecer) ? nomeParecerista(parceristaAtualId(parecer)) : 'responsável pelo departamento';
  const novoPrazo = calcularPrazo(parecer.dataSolicitacaoAtual, 21);
  return template
    .replaceAll('{parecerista}', saudacao)
    .replaceAll('{processo}', numeroProcesso(parecer))
    .replaceAll('{categoria}', labelCategoria(parecer))
    .replaceAll('{tipo}', parecer.tipoParecer || '—')
    .replaceAll('{departamento}', parecer.departamento || '—')
    .replaceAll('{numero_parecer}', pad(parecer.numero))
    .replaceAll('{novo_prazo}', fmtDate(novoPrazo));
}

function construirRascunhoAviso(p){
  const parceristaId = parceristaAtualId(p);
  const parecerista = state.pareceristas.find(x=>x.id===parceristaId);
  return {
    to: parecerista ? parecerista.email : '',
    subject: `Parecer pendente — processo ${numeroProcesso(p)}`,
    body: preencherTemplate(state.emailTemplate, p)
  };
}

function ligarBotoesCopiar(overlay){
  overlay.querySelectorAll('[data-copiar]').forEach(el=>{
    el.onclick = () => {
      const campo = document.getElementById(el.dataset.copiar);
      const status = document.getElementById(el.dataset.status);
      const texto = campo.value;
      const marcarSelecionado = () => {
        campo.removeAttribute('readonly');
        campo.select();
        if(status){ status.style.color='var(--ink-soft)'; status.textContent='Selecionado — use Ctrl+C (ou Cmd+C) para copiar.'; }
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto)
          .then(()=>{ if(status){ status.style.color='var(--green)'; status.textContent='Copiado!'; } })
          .catch(marcarSelecionado);
      } else {
        marcarSelecionado();
      }
    };
  });
}

function ordenarPareceres(lista){
  const copia = lista.slice();
  if(!ordenacao.coluna){
    copia.sort((a,b)=>{
      const pa = a.dataConclusao || (a.faseAtual===1 ? a.prazoFase1 : a.prazoFase2);
      const pb = b.dataConclusao || (b.faseAtual===1 ? b.prazoFase1 : b.prazoFase2);
      return (pa||'').localeCompare(pb||'');
    });
    return copia;
  }
  const dir = ordenacao.direcao === 'asc' ? 1 : -1;
  copia.sort((a,b)=>{
    let va, vb, numerico = false;
    switch(ordenacao.coluna){
      case 'numero': va=a.numero; vb=b.numero; numerico=true; break;
      case 'processo': va=numeroProcesso(a); vb=numeroProcesso(b); break;
      case 'departamento': va=a.departamento||''; vb=b.departamento||''; break;
      case 'parecerista': va=descricaoResponsavel(a); vb=descricaoResponsavel(b); break;
      case 'prazo': va = a.dataConclusao || (a.faseAtual===1?a.prazoFase1:a.prazoFase2) || ''; vb = b.dataConclusao || (b.faseAtual===1?b.prazoFase1:b.prazoFase2) || ''; break;
      case 'status': { const ordem={atrasado:0,em_dia:1,concluido:2}; va=ordem[statusParecer(a)]; vb=ordem[statusParecer(b)]; numerico=true; break; }
      default: va=0; vb=0;
    }
    const cmp = numerico ? (va - vb) : String(va).localeCompare(String(vb), 'pt-BR', { numeric:true, sensitivity:'base' });
    return cmp * dir;
  });
  return copia;
}

      <button class="tab ${abaAtual==='bolsas'?'active':''}" data-tab="bolsas">Bolsas</button>

    </div>

    document.getElementById('descartar-conflito').onclick = descartarConflitoRemoto;
  }

    document.getElementById('btn-pareceristas').onclick = () => abrirModalPareceristas();
    document.getElementById('btn-departamentos').onclick = abrirModalDepartamentos;
    document.getElementById('btn-feriados').onclick = abrirModalFeriados;
    document.getElementById('btn-grupos').onclick = abrirModalGrupos;
    document.getElementById('btn-conflitos').onclick = abrirModalConflitos;
    document.getElementById('btn-email-template').onclick = abrirModalTemplate;
    document.getElementById('btn-declaracao').onclick = abrirModalDeclaracao;
    document.getElementById('btn-sincronizacao').onclick = abrirModalSincronizacao;
    document.querySelectorAll('.filter-chip').forEach(el=>{ el.onclick = () => { filtro = el.dataset.filtro; render(); }; });
    document.querySelectorAll('[data-excluir]').forEach(el=>{ el.onclick = () => excluirParecer(el.dataset.excluir); });
    document.querySelectorAll('[data-editar-depto]').forEach(el=>{ el.onclick = () => abrirModalEditarDepartamento(el.dataset.editarDepto); });
    document.querySelectorAll('[data-marcar-emitido]').forEach(el=>{ el.onclick = () => marcarEmitido(el.dataset.marcarEmitido); });
    document.querySelectorAll('[data-marcar-nao]').forEach(el=>{ el.onclick = () => abrirDecisaoNaoEmitido(el.dataset.marcarNao); });
    document.querySelectorAll('[data-declinar]').forEach(el=>{ el.onclick = () => abrirModalFase2Nao(el.dataset.declinar, 'declinado_justificado'); });
    document.querySelectorAll('[data-ver-aviso]').forEach(el=>{ el.onclick = () => abrirModalFase1Nao(el.dataset.verAviso, 'visualizar'); });
    const buscaEl = document.getElementById('f-busca');
    if(buscaEl){
      buscaEl.oninput = (e) => {
        filtroTexto = e.target.value;
        const cursor = e.target.selectionStart;
        render();
        const novoBusca = document.getElementById('f-busca');
        if(novoBusca){ novoBusca.focus(); novoBusca.setSelectionRange(cursor, cursor); }
      };
    }
    document.querySelectorAll('[data-ordenar]').forEach(el=>{
      el.onclick = () => {
        const coluna = el.dataset.ordenar;
        if(ordenacao.coluna === coluna){
          ordenacao.direcao = ordenacao.direcao === 'asc' ? 'desc' : 'asc';
        } else {
          ordenacao = { coluna, direcao: 'asc' };
        }
        render();
      };
    });
  }

  if(abaAtual === 'dashboard'){
    const buscaRecip = document.getElementById('f-busca-reciprocidade');
    if(buscaRecip){
      buscaRecip.oninput = (e) => {
        filtroTextoReciprocidade = e.target.value;
        const cursor = e.target.selectionStart;
        render();
        const novoBusca = document.getElementById('f-busca-reciprocidade');
        if(novoBusca){ novoBusca.focus(); novoBusca.setSelectionRange(cursor, cursor); }
      };
    }
    document.querySelectorAll('[data-ordenar-reciprocidade]').forEach(el=>{
      el.onclick = () => {
        const coluna = el.dataset.ordenarReciprocidade;
        if(ordenacaoReciprocidade.coluna === coluna){
          ordenacaoReciprocidade.direcao = ordenacaoReciprocidade.direcao === 'asc' ? 'desc' : 'asc';
        } else {
          ordenacaoReciprocidade = { coluna, direcao: 'asc' };
        }
        render();
      };
    });
  }

    document.querySelectorAll('[data-excluir-bolsa]').forEach(el=>{ el.onclick = () => excluirBolsa(el.dataset.excluirBolsa); });
  }

  document.querySelectorAll('[data-alerta-fase1-sim]').forEach(el=>{ el.onclick = () => marcarEmitido(el.dataset.alertaFase1Sim); });
  document.querySelectorAll('[data-alerta-fase1-nao]').forEach(el=>{ el.onclick = () => abrirModalFase1Nao(el.dataset.alertaFase1Nao); });
  document.querySelectorAll('[data-alerta-fase2-sim]').forEach(el=>{ el.onclick = () => marcarEmitido(el.dataset.alertaFase2Sim); });
  document.querySelectorAll('[data-alerta-fase2-nao]').forEach(el=>{ el.onclick = () => abrirModalFase2Nao(el.dataset.alertaFase2Nao); });

  if(abaAtual === 'dashboard') montarGraficos();
  if(abaAtual === 'bolsas') montarGraficosBolsas();
}

function alertaHtml(a){
  const p = a.parecer;
  if(a.tipo === 'fase1'){
    return `
      <div class="alert-card">
        <p>Parecer nº ${pad(p.numero)} — processo ${escapeHtml(numeroProcesso(p))} — o prazo de 14 dias com ${escapeHtml(descricaoResponsavel(p))} foi encerrado. O parecer foi emitido?</p>
        <div class="alert-actions">
          <button class="btn btn-sm" data-alerta-fase1-sim="${p.id}">Sim</button>
          <button class="btn-ghost btn-sm" data-alerta-fase1-nao="${p.id}">Não</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="alert-card">
      <p>Parecer nº ${pad(p.numero)} — processo ${escapeHtml(numeroProcesso(p))} — prazo final (21 dias) com ${escapeHtml(descricaoResponsavel(p))} foi encerrado. O parecer foi emitido?</p>
      <div class="alert-actions">
        <button class="btn btn-sm" data-alerta-fase2-sim="${p.id}">Sim</button>
        <button class="btn-ghost btn-sm" data-alerta-fase2-nao="${p.id}">Não, escolher novo parecerista</button>
      </div>
    </div>
  `;
}

function paginaPareceres(lista){
  return `
    <div class="actions">
      <button class="btn" id="btn-novo">+ Novo parecer</button>
      <button class="btn-ghost" id="btn-pareceristas">Pareceristas</button>

      <button class="btn-ghost" id="btn-feriados">Feriados</button>
      <button class="btn-ghost" id="btn-grupos">Grupos de departamentos</button>
      <button class="btn-ghost" id="btn-conflitos">Conflitos de interesse</button>
      <button class="btn-ghost" id="btn-email-template">Modelo de e-mail</button>
      <button class="btn-ghost" id="btn-declaracao">Declarações</button>
      <button class="btn-ghost" id="btn-sincronizacao">Backup e sincronização</button>
    </div>
    <div class="filters" style="align-items:center;">
      <input id="f-busca" type="text" placeholder="Buscar por processo, parecerista, departamento, categoria..." value="${escapeHtml(filtroTexto)}" style="flex:1;min-width:220px;max-width:420px;padding:0.5rem 0.8rem;border:1px solid var(--line);border-radius:20px;background:var(--paper-raised);font-size:0.85rem;">

}

function filterChip(key,label){ return `<button class="filter-chip${filtro===key?' active':''}" data-filtro="${key}">${label}</button>`; }

function tabela(lista){
  const rows = lista.map(p=>{
    const st = statusParecer(p);
    const stampLabel = st==='concluido' ? 'Concluído' : (st==='atrasado' ? 'Atrasado' : 'Em dia');
    const stampClass = st==='concluido' ? 'concluido' : (st==='atrasado' ? 'atrasado' : 'em-dia');
    const prazoAtivo = p.faseAtual===1 ? p.prazoFase1 : p.prazoFase2;
    const faseLabel = p.dataConclusao ? '' : `<span class="badge-fase">${p.faseAtual===1?'1ª fase (14 dias)':'2ª fase (prazo final)'}</span>`;
    return `
      <tr>
        <td class="col-num">Nº ${pad(p.numero)}</td>
        <td class="col-title">${escapeHtml(numeroProcesso(p))}<span class="sub">${escapeHtml(labelCategoria(p))}${p.tipoParecer ? ' · '+escapeHtml(p.tipoParecer) : ''}${p.avaliadoPelaComissao ? ' · comissão de pesquisa' : ''}${p.autorNUSP ? ' · autor '+escapeHtml(p.autorNUSP) : ''}</span></td>
        <td class="muted">${escapeHtml(p.departamento||'—')}</td>
        <td>${escapeHtml(descricaoResponsavel(p))}</td>
        <td class="col-date">${fmtDate(p.dataConclusao ? p.dataConclusao : prazoAtivo)}${faseLabel}</td>
        <td><span class="stamp ${stampClass}">${stampLabel}</span></td>
        <td>
          <div class="row-actions">
            ${!p.dataConclusao ? `
              <button class="icon-btn" data-marcar-emitido="${p.id}" title="Marcar como emitido" aria-label="Marcar como emitido">✓</button>
              <button class="icon-btn" data-marcar-nao="${p.id}" title="Ainda não emitido" aria-label="Ainda não emitido">↻</button>
              ${parceristaAtualId(p) ? `<button class="icon-btn" data-declinar="${p.id}" title="Parecerista declinou" aria-label="Parecerista declinou">⊘</button>` : ''}
            ` : ''}
            ${(p.ultimoAvisoEmail || p.emailEnviadoFase1) ? `<button class="icon-btn" data-ver-aviso="${p.id}" title="Ver/copiar aviso enviado" aria-label="Ver/copiar aviso enviado">✉</button>` : ''}
            <button class="icon-btn" data-editar-depto="${p.id}" title="Editar departamento" aria-label="Editar departamento">✎</button>
            <button class="icon-btn danger" data-excluir="${p.id}" title="Excluir" aria-label="Excluir">✕</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  return `
    <table>
      <thead><tr>
        ${thOrdenavel('Registro','numero')}${thOrdenavel('Processo','processo')}${thOrdenavel('Departamento','departamento')}${thOrdenavel('Parecerista','parecerista')}${thOrdenavel('Prazo / conclusão','prazo')}${thOrdenavel('Status','status')}<th>Ações</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function thOrdenavel(label, coluna){
  const ativo = ordenacao.coluna === coluna;
  const seta = ativo ? (ordenacao.direcao==='asc' ? '▲' : '▼') : '⇅';
  return `<th data-ordenar="${coluna}" style="cursor:pointer;user-select:none;">${label} <span style="opacity:${ativo?1:0.4};font-size:0.75em;">${seta}</span></th>`;
}

function thOrdenavelReciprocidade(label, coluna){
  const ativo = ordenacaoReciprocidade.coluna === coluna;
  const seta = ativo ? (ordenacaoReciprocidade.direcao==='asc' ? '▲' : '▼') : '⇅';
  return `<th data-ordenar-reciprocidade="${coluna}" style="cursor:pointer;user-select:none;">${label} <span style="opacity:${ativo?1:0.4};font-size:0.75em;">${seta}</span></th>`;
}

function ordenarReciprocidade(lista){
  const copia = lista.slice();
  const coluna = ordenacaoReciprocidade.coluna || 'saldo';
  const dir = (ordenacaoReciprocidade.coluna ? (ordenacaoReciprocidade.direcao === 'asc' ? 1 : -1) : 1);
  copia.sort((a,b)=>{
    let va = a[coluna], vb = b[coluna];
    const numerico = ['deu','recebeu','saldo'].includes(coluna);
    const cmp = numerico ? (va - vb) : String(va).localeCompare(String(vb), 'pt-BR', { numeric:true, sensitivity:'base' });
    return cmp * dir;
  });
  return copia;
}

function emptyState(){
  if(filtroTexto.trim()){
    return `<div class="empty-state"><p class="big">Nenhum resultado para "${escapeHtml(filtroTexto)}"</p><p>Tente outro termo ou limpe a busca.</p></div>`;
  }
  return `<div class="empty-state"><p class="big">Nenhum parecer registrado</p><p>Clique em "Novo parecer" para abrir o primeiro registro.</p></div>`;
}

/* ---------- Bolsas ---------- */

function anoCicloAtual(){
  const hoje = new Date();
  const mes = hoje.getMonth(); // 0=jan ... 8=set ... 11=dez
  return mes >= 8 ? hoje.getFullYear() : hoje.getFullYear() - 1;
}

function cicloNaoConsolidado(ano){
  // primeiros 7 meses do ciclo: setembro/ano a março/(ano+1)
  const hoje = new Date();
  const inicio = new Date(ano, 8, 1);
  const fim = new Date(ano + 1, 2, 31, 23, 59, 59);
  return hoje >= inicio && hoje <= fim;
}

function paginaBolsas(){
  const registros = state.bolsas.slice().sort((a,b)=> b.ano - a.ano || a.modalidade.localeCompare(b.modalidade,'pt-BR'));
  const totalSolicitadas = registros.reduce((s,b)=>s+b.solicitadas,0);
  const totalConcedidas = registros.reduce((s,b)=>s+b.concedidas,0);
  const cicloAtual = anoCicloAtual();
  const temRegistroNaoConsolidado = registros.some(b => b.ano === cicloAtual && cicloNaoConsolidado(b.ano));

  return `
    <div class="actions">
      <button class="btn" id="btn-nova-bolsa">+ Registrar bolsas</button>
    </div>
    ${temRegistroNaoConsolidado ? `
      <div class="flash" style="background:var(--brass-light);border-color:var(--brass);color:var(--brass-dark);">
        Os dados do ciclo ${cicloAtual}/${cicloAtual+1} ainda são uma informação não consolidada, pois pode haver redistribuição de bolsas ao longo do período (setembro a março).
      </div>
    ` : ''}
    <div class="dash-grid">
      <div class="metric-card"><div class="num">${registros.length}</div><div class="lbl">Ciclos registrados</div></div>
      <div class="metric-card"><div class="num">${totalSolicitadas}</div><div class="lbl">Total solicitadas</div></div>
      <div class="metric-card green"><div class="num">${totalConcedidas}</div><div class="lbl">Total concedidas</div></div>
    </div>
    <div class="ledger" style="margin-bottom:1.5rem;">
      ${registros.length ? `
        <table>
          <thead><tr><th>Ciclo</th><th>Modalidade</th><th>Solicitadas</th><th>Concedidas</th><th>% Concedido</th><th>Ações</th></tr></thead>
          <tbody>
            ${registros.map(b=>{
              const pct = b.solicitadas > 0 ? Math.round((b.concedidas/b.solicitadas)*100) : 0;
              const naoConsolidado = b.ano === cicloAtual && cicloNaoConsolidado(b.ano);
              return `<tr>
                <td class="col-date">${b.ano}/${b.ano+1}${naoConsolidado ? `<span class="badge-fase" style="color:var(--brass-dark);">não consolidado</span>` : ''}</td>
                <td class="col-title">${escapeHtml(b.modalidade)}${b.porCategoria ? `<span class="sub">${CATEGORIAS_BOLSA.filter(c=>b.porCategoria[c] && b.porCategoria[c].solicitadas>0).map(c=>`${c}: ${b.porCategoria[c].concedidas}/${b.porCategoria[c].solicitadas}`).join(' · ')}</span>` : ''}</td>
                <td>${b.solicitadas}</td>
                <td>${b.concedidas}</td>
                <td class="muted">${pct}%</td>
                <td>
                  <div class="row-actions">
                    <button class="icon-btn" data-editar-bolsa="${b.id}" title="Editar" aria-label="Editar">✎</button>
                    <button class="icon-btn danger" data-excluir-bolsa="${b.id}" title="Excluir" aria-label="Excluir">✕</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : `<div class="empty-state"><p class="big">Nenhuma bolsa registrada</p><p>Clique em "Registrar bolsas" para adicionar o primeiro ciclo.</p></div>`}
    </div>
    ${registros.length ? `
    <div class="chart-grid">
      <div class="chart-card"><h3>Solicitadas x concedidas por modalidade</h3>${graficosDisponiveis() ? `<div style="height:260px;"><canvas id="chart-bolsas-modalidade"></canvas></div>` : avisoGraficoIndisponivel()}</div>
      <div class="chart-card"><h3>Evolução de bolsas concedidas por ciclo</h3>${graficosDisponiveis() ? `<div style="height:260px;"><canvas id="chart-bolsas-evolucao"></canvas></div>` : avisoGraficoIndisponivel()}</div>
      <div class="chart-card" style="grid-column:1 / -1;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.6rem;margin-bottom:0.8rem;">
          <h3 style="margin:0;">Solicitadas x concedidas por ano</h3>
          <select id="f-modalidade-grafico-bolsas" style="width:auto;padding:0.3rem 0.6rem;font-size:0.8rem;">
            ${MODALIDADES_BOLSA.map(m=>`<option value="${escapeHtml(m)}" ${modalidadeGraficoBolsas===m?'selected':''}>${escapeHtml(m)}</option>`).join('')}
          </select>
        </div>
        ${graficosDisponiveis() ? `<div style="height:260px;"><canvas id="chart-bolsas-por-ano"></canvas></div>` : avisoGraficoIndisponivel()}
      </div>
    </div>
    ` : ''}
  `;
}

function abrirModalBolsa(bolsaId){
  const overlay = criarOverlay();
  const existente = bolsaId ? state.bolsas.find(b=>b.id===bolsaId) : null;

  const montarCamposQuantidade = (modalidade) => {
    if(modalidadeTemCategoria(modalidade)){
      const porCategoria = (existente && existente.porCategoria) || {};
      return `
        <p class="field-hint" style="margin-bottom:0.6rem;">Informe solicitadas e concedidas em cada categoria. O total é somado automaticamente.</p>
        <table class="mini-table" style="margin-bottom:0.8rem;">
          <thead><tr><th>Categoria</th><th>Solicitadas</th><th>Concedidas</th></tr></thead>
          <tbody>
            ${CATEGORIAS_BOLSA.map(cat => `
              <tr>
                <td>${cat}</td>
                <td><input id="f-bolsa-sol-${cat}" type="number" min="0" value="${porCategoria[cat] ? porCategoria[cat].solicitadas : ''}"></td>
                <td><input id="f-bolsa-con-${cat}" type="number" min="0" value="${porCategoria[cat] ? porCategoria[cat].concedidas : ''}"></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
    return `
      <div class="field-row">
        <div class="field"><label for="f-bolsa-solicitadas">Solicitadas</label><input id="f-bolsa-solicitadas" type="number" min="0" value="${existente ? existente.solicitadas : ''}"></div>
        <div class="field"><label for="f-bolsa-concedidas">Concedidas</label><input id="f-bolsa-concedidas" type="number" min="0" value="${existente ? existente.concedidas : ''}"></div>
      </div>
    `;
  };

  const desenhar = () => {
    const modalidadeAtual = document.getElementById('f-bolsa-modalidade')
      ? document.getElementById('f-bolsa-modalidade').value
      : (existente ? existente.modalidade : MODALIDADES_BOLSA[0]);
    overlay.innerHTML = `
      <div class="modal${modalidadeTemCategoria(modalidadeAtual) ? ' modal-wide' : ''}">
        <h2>${existente ? 'Editar registro de bolsas' : 'Registrar bolsas do ano'}</h2>
        <div class="field">
          <label for="f-bolsa-modalidade">Modalidade</label>
          <select id="f-bolsa-modalidade">
            ${MODALIDADES_BOLSA.map(m=>`<option value="${escapeHtml(m)}" ${modalidadeAtual===m ? 'selected':''}>${escapeHtml(m)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="f-bolsa-ano">Ano de início do ciclo (setembro)</label>
          <input id="f-bolsa-ano" type="number" min="2000" max="2100" value="${existente ? existente.ano : ''}" placeholder="Ex: 2023">
          <p class="field-hint">Vigência de setembro a agosto do ano seguinte (12 meses).</p>
          ${(() => {
            const anoRef = existente ? existente.ano : anoCicloAtual();
            return (anoRef === anoCicloAtual() && cicloNaoConsolidado(anoRef))
              ? `<p class="field-hint" style="color:var(--brass-dark);">Atenção: este ciclo ainda está em andamento (set/${anoRef} a mar/${anoRef+1}) — os números podem mudar por redistribuição.</p>`
              : '';
          })()}
        </div>
        <div id="campo-quantidades-bolsa">${montarCamposQuantidade(modalidadeAtual)}</div>
        <div class="field-error" id="err-bolsa"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelar">Cancelar</button>
          <button class="btn" id="salvar-bolsa">${existente ? 'Salvar' : 'Registrar'}</button>
        </div>
      </div>
    `;
    document.getElementById('f-bolsa-modalidade').onchange = (e) => {
      document.getElementById('campo-quantidades-bolsa').innerHTML = montarCamposQuantidade(e.target.value);
    };
    document.getElementById('cancelar').onclick = fecharOverlay;
    document.getElementById('salvar-bolsa').onclick = () => {
      const modalidade = document.getElementById('f-bolsa-modalidade').value;
      const ano = Number(document.getElementById('f-bolsa-ano').value);
      const erro = document.getElementById('err-bolsa');
      erro.textContent = '';
      if(!ano || ano < 2000){ erro.textContent = 'Informe um ano válido.'; return; }

      let solicitadas, concedidas, porCategoria = null;
      if(modalidadeTemCategoria(modalidade)){
        porCategoria = {};
        solicitadas = 0;
        concedidas = 0;
        for(const cat of CATEGORIAS_BOLSA){
          const solEl = document.getElementById(`f-bolsa-sol-${cat}`);
          const conEl = document.getElementById(`f-bolsa-con-${cat}`);
          const sol = solEl.value === '' ? 0 : Number(solEl.value);
          const con = conEl.value === '' ? 0 : Number(conEl.value);
          if(sol < 0 || con < 0){ erro.textContent = `Valores da categoria ${cat} não podem ser negativos.`; return; }
          if(con > sol){ erro.textContent = `Na categoria ${cat}, concedidas não pode ser maior que solicitadas.`; return; }
          porCategoria[cat] = { solicitadas: sol, concedidas: con };
          solicitadas += sol;
          concedidas += con;
        }
        if(solicitadas === 0){ erro.textContent = 'Informe ao menos uma categoria com bolsas solicitadas.'; return; }
      } else {
        solicitadas = Number(document.getElementById('f-bolsa-solicitadas').value);
        concedidas = Number(document.getElementById('f-bolsa-concedidas').value);
        if(document.getElementById('f-bolsa-solicitadas').value === '' || solicitadas < 0){ erro.textContent = 'Informe a quantidade solicitada.'; return; }
        if(document.getElementById('f-bolsa-concedidas').value === '' || concedidas < 0){ erro.textContent = 'Informe a quantidade concedida.'; return; }
        if(concedidas > solicitadas){ erro.textContent = 'O nº de concedidas não pode ser maior que o de solicitadas.'; return; }
      }

      if(existente){
        existente.modalidade = modalidade;
        existente.ano = ano;
        existente.solicitadas = solicitadas;
        existente.concedidas = concedidas;
        existente.porCategoria = porCategoria;
      } else {
        const duplicado = state.bolsas.find(b=>b.modalidade===modalidade && b.ano===ano);
        if(duplicado){ erro.textContent = `Já existe um registro de ${modalidade} para o ciclo ${ano}/${ano+1}. Edite o registro existente em vez de criar outro.`; return; }
        state.bolsas.push({ id: uid(), modalidade, ano, solicitadas, concedidas, porCategoria });
      }
      saveState();
      fecharOverlay();
      flashMsg = `Registro de ${modalidade} (${ano}/${ano+1}) salvo.`;
      render();
    };
  };
  desenhar();
}

function excluirBolsa(id){
  state.bolsas = state.bolsas.filter(b=>b.id!==id);
  saveState();
  render();
}

function pluginRotulosBarras(){
  return {
    id: 'rotulosBarras',
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      chart.data.datasets.forEach((dataset, i) => {
        const meta = chart.getDatasetMeta(i);
        if(meta.hidden) return;
        meta.data.forEach((bar, index) => {
          const valor = dataset.data[index];
          if(valor === undefined || valor === null) return;
          ctx.save();
          ctx.fillStyle = '#1C2B45';
          ctx.font = '600 11px "Public Sans", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(String(valor), bar.x, bar.y - 4);
          ctx.restore();
        });
      });
    }
  };
}

function montarGraficosBolsas(){
  if(!graficosDisponiveis()) return;
  try{
    if(chartInstances.bolsasModalidade){ chartInstances.bolsasModalidade.destroy(); }
    if(chartInstances.bolsasEvolucao){ chartInstances.bolsasEvolucao.destroy(); }
    if(chartInstances.bolsasPorAno){ chartInstances.bolsasPorAno.destroy(); }

    const porModalidade = {};
    MODALIDADES_BOLSA.forEach(m=> porModalidade[m] = { solicitadas:0, concedidas:0 });
    state.bolsas.forEach(b=>{
      if(!porModalidade[b.modalidade]) porModalidade[b.modalidade] = { solicitadas:0, concedidas:0 };
      porModalidade[b.modalidade].solicitadas += b.solicitadas;
      porModalidade[b.modalidade].concedidas += b.concedidas;
    });
    const modalidades = Object.keys(porModalidade);

    const ctx1 = document.getElementById('chart-bolsas-modalidade');
    if(ctx1){
      chartInstances.bolsasModalidade = new Chart(ctx1, {
        type:'bar',
        data:{
          labels: modalidades,
          datasets:[
            { label:'Solicitadas', data: modalidades.map(m=>porModalidade[m].solicitadas), backgroundColor:'#1C2B45' },
            { label:'Concedidas', data: modalidades.map(m=>porModalidade[m].concedidas), backgroundColor:'#52734F' }
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:18 } }, plugins:{ legend:{ display:true, position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } },
        plugins:[pluginRotulosBarras()]
      });
    }

    const ciclos = Array.from(new Set(state.bolsas.map(b=>b.ano))).sort((a,b)=>a-b);
    const cores = { 'PIBIC':'#A9752E', 'PIBITI':'#1C2B45', 'PIBIC Cota':'#52734F', 'PIBIC-EM':'#9C3B34' };
    const datasetsEvolucao = MODALIDADES_BOLSA.map(m=>({
      label: m,
      data: ciclos.map(ano => { const r = state.bolsas.find(b=>b.modalidade===m && b.ano===ano); return r ? r.concedidas : 0; }),
      borderColor: cores[m] || '#5B6478',
      backgroundColor: 'transparent',
      tension: 0.25
    }));

    const ctxEvolucao = document.getElementById('chart-bolsas-evolucao');
    if(ctxEvolucao){
      chartInstances.bolsasEvolucao = new Chart(ctxEvolucao, {
        type:'line',
        data:{ labels: ciclos.map(a=>`${a}/${a+1}`), datasets: datasetsEvolucao },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:true, position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
      });
    }

    const seletorModalidade = document.getElementById('f-modalidade-grafico-bolsas');
    if(seletorModalidade){
      seletorModalidade.onchange = (e) => {
        modalidadeGraficoBolsas = e.target.value;
        montarGraficosBolsas();
      };
    }

    const registrosModalidade = state.bolsas
      .filter(b=>b.modalidade===modalidadeGraficoBolsas)
      .sort((a,b)=>a.ano-b.ano);
    const anosPorAno = registrosModalidade.map(b=>`${b.ano}/${b.ano+1}`);

    const ctxPorAno = document.getElementById('chart-bolsas-por-ano');
    if(ctxPorAno){
      chartInstances.bolsasPorAno = new Chart(ctxPorAno, {
        type:'bar',
        data:{
          labels: anosPorAno,
          datasets:[
            { label:'Solicitadas', data: registrosModalidade.map(b=>b.solicitadas), backgroundColor:'#1C2B45' },
            { label:'Concedidas', data: registrosModalidade.map(b=>b.concedidas), backgroundColor:'#52734F' }
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:18 } }, plugins:{ legend:{ display:true, position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } },
        plugins:[pluginRotulosBarras()]
      });
    }
  }catch(e){
    console.error('Falha ao montar gráficos de bolsas', e);
  }
}
