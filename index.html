  overlay.innerHTML = `
    <div class="modal">
      <h2>Editar departamento</h2>
      <p class="field-hint" style="margin-bottom:1rem;">Parecer nº ${pad(p.numero)} — processo ${escapeHtml(numeroProcesso(p))}.</p>
      <div class="field">
        <label for="f-editar-depto">Departamento vinculado à atividade</label>
        <input id="f-editar-depto" type="text" list="lista-departamentos-editar" value="${escapeHtml(p.departamento||'')}" placeholder="Ex: ZEA">
        <datalist id="lista-departamentos-editar">${departamentos.map(d=>`<option value="${escapeHtml(d)}">`).join('')}</datalist>
      </div>
      <div class="field-error" id="err-editar-depto"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelar">Cancelar</button>
        <button class="btn" id="salvar-depto">Salvar</button>
      </div>
    </div>
  `;
  document.getElementById('cancelar').onclick = fecharOverlay;
  document.getElementById('salvar-depto').onclick = () => {
    const valor = document.getElementById('f-editar-depto').value.trim();
    if(!valor){ document.getElementById('err-editar-depto').textContent = 'Informe um departamento.'; return; }
    p.departamento = canonicalizarDepartamentoDigitado(valor);
    saveState();
    flashMsg = `Departamento do parecer nº ${pad(p.numero)} atualizado para ${escapeHtml(p.departamento)}.`;
    fecharOverlay();
    render();
  };
}

/* ---------- Dashboard ---------- */

function paginaDashboard(){
  const total = state.pareceres.length;
  const concluidos = state.pareceres.filter(p=>p.dataConclusao).length;
  const atrasados = state.pareceres.filter(p=>!p.dataConclusao && statusParecer(p)==='atrasado').length;
  const naoEmitidos = {};
  state.pareceres.forEach(p=> p.historicoDecisoes.forEach(h=>{
    if(h.resultado==='nao_emitido'){
      const ehDeclinio = h.motivo==='declinado_justificado';
      // "perdeu o prazo" só conta quando os 21 dias completos (2ª fase) já passaram sem entrega;
      // perder só o 1º prazo de 14 dias apenas prorroga, não é uma falha definitiva ainda.
      if(ehDeclinio || h.fase === 2){
        naoEmitidos[h.parceristaId] = naoEmitidos[h.parceristaId] || { prazoPerdido:0, declinado:0 };
        if(ehDeclinio) naoEmitidos[h.parceristaId].declinado++;
        else naoEmitidos[h.parceristaId].prazoPerdido++;
      }
    }
  }));
  const ranking = Object.keys(naoEmitidos).map(id=>({
    id, nome: nomeParecerista(id), departamento: (state.pareceristas.find(p=>p.id===id)||{}).departamento || '—',
    ...naoEmitidos[id]
  })).sort((a,b)=> (b.prazoPerdido+b.declinado) - (a.prazoPerdido+a.declinado));

  let reciprocidade = state.pareceristas
    .map(p=>({ id:p.id, nome:p.nome, departamento:p.departamento||'—', deu: contarAtribuicoes(p.id), recebeu: contarAvaliacoesRecebidas(p.id), saldo: saldoReciprocidade(p.id) }))
    .filter(r=> r.deu>0 || r.recebeu>0);
  if(filtroTextoReciprocidade.trim()){
    const termo = normaliza(filtroTextoReciprocidade);
    reciprocidade = reciprocidade.filter(r => normaliza(r.nome).includes(termo) || normaliza(r.departamento).includes(termo));
  }
  reciprocidade = ordenarReciprocidade(reciprocidade);

  const { todosDeptos: todosDeptosGrafico } = calcularDadosDepartamento();
  const alturaGraficoDepto = Math.max(200, todosDeptosGrafico.length * 32 + 40);
  const qtdCategoriasGrafico = new Set(state.pareceres.map(p=>labelCategoria(p))).size;
  const alturaGraficoCategoria = Math.max(200, qtdCategoriasGrafico * 32 + 40);

  return `
    <div class="dash-grid">
      <div class="metric-card"><div class="num">${total}</div><div class="lbl">Pareceres registrados</div></div>
      <div class="metric-card green"><div class="num">${concluidos}</div><div class="lbl">Concluídos</div></div>
      <div class="metric-card red"><div class="num">${atrasados}</div><div class="lbl">Em atraso agora</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-card"><h3>Situação atual</h3>${graficosDisponiveis() ? `<canvas id="chart-status"></canvas>` : avisoGraficoIndisponivel()}</div>
      <div class="chart-card"><h3>Pareceres por categoria</h3>${graficosDisponiveis() ? `<div style="height:${alturaGraficoCategoria}px;"><canvas id="chart-categoria"></canvas></div>` : avisoGraficoIndisponivel()}</div>
      <div class="chart-card"><h3>Pareceres solicitados por departamento</h3>${graficosDisponiveis() ? `<div style="height:${alturaGraficoDepto}px;"><canvas id="chart-departamento"></canvas></div>` : avisoGraficoIndisponivel()}</div>
      <div class="chart-card"><h3>Pareceres emitidos por departamento</h3>${graficosDisponiveis() ? `<div style="height:${alturaGraficoDepto}px;"><canvas id="chart-departamento-emitidos"></canvas></div>` : avisoGraficoIndisponivel()}</div>
      <div class="chart-card">
        <h3>Pareceristas que não emitiram</h3>
        ${ranking.length ? `
          <div class="rank-table-wrap">
          <table class="rank-table">
            <thead><tr><th>Parecerista</th><th>Depto.</th><th>Perdeu o prazo</th><th>Declinou (justificado)</th></tr></thead>
            <tbody>${ranking.map(r=>`<tr><td>${escapeHtml(r.nome)}</td><td class="muted">${escapeHtml(r.departamento)}</td><td>${r.prazoPerdido}</td><td>${r.declinado}</td></tr>`).join('')}</tbody>
          </table>
          </div>
        ` : `<p class="field-hint">Nenhuma pendência registrada até o momento.</p>`}
      </div>
      <div class="chart-card">
        <h3>Balanço de reciprocidade</h3>
        <p class="field-hint" style="margin-top:-0.4rem;">Quantas vezes cada um avaliou (deu) versus foi avaliado (recebeu), pelo nº USP do autor. Saldo negativo indica quem está "devendo" um parecer.</p>
        <input id="f-busca-reciprocidade" type="text" placeholder="Buscar por nome ou departamento..." value="${escapeHtml(filtroTextoReciprocidade)}" style="width:100%;padding:0.45rem 0.7rem;border:1px solid var(--line);border-radius:20px;background:var(--paper);font-size:0.82rem;margin-bottom:0.7rem;">
        ${reciprocidade.length ? `
          <div class="rank-table-wrap">
          <table class="rank-table">
            <thead><tr>
              ${thOrdenavelReciprocidade('Parecerista','nome')}${thOrdenavelReciprocidade('Depto.','departamento')}${thOrdenavelReciprocidade('Avaliou','deu')}${thOrdenavelReciprocidade('Foi avaliado','recebeu')}${thOrdenavelReciprocidade('Saldo','saldo')}
            </tr></thead>
            <tbody>${reciprocidade.map(r=>`<tr><td>${escapeHtml(r.nome)}</td><td class="muted">${escapeHtml(r.departamento)}</td><td>${r.deu}</td><td>${r.recebeu}</td><td style="color:${r.saldo<0?'var(--red)':(r.saldo>0?'var(--green)':'var(--ink-soft)')}">${r.saldo>0?'+':''}${r.saldo}</td></tr>`).join('')}</tbody>
          </table>
          </div>
        ` : `<p class="field-hint">${filtroTextoReciprocidade.trim() ? `Nenhum resultado para "${escapeHtml(filtroTextoReciprocidade)}".` : 'Sem dados suficientes ainda — o nº USP do autor avaliado precisa ser preenchido nos pareceres para calcular o saldo.'}</p>`}
      </div>
    </div>
  `;
}

function graficosDisponiveis(){
  return typeof Chart !== 'undefined';
}

function avisoGraficoIndisponivel(){
  return `<p class="field-hint">Não foi possível carregar a biblioteca de gráficos (a rede pode estar bloqueando recursos externos). Os números continuam corretos nas outras tabelas desta página — tente recarregar a página com internet disponível.</p>`;
}

function calcularDadosDepartamento(){
  const mapaCanonico = new Map();
  const canonizar = (d) => {
    const bruto = d || 'Não informado';
    const n = normaliza(bruto);
    if(!mapaCanonico.has(n)) mapaCanonico.set(n, bruto);
    return mapaCanonico.get(n);
  };
  // semeia primeiro com os departamentos "oficiais" (cadastro de pareceristas/extras),
  // para que a grafia deles prevaleça sobre eventuais inconsistências em pareceres antigos
  departamentosConhecidos().forEach(d=>canonizar(d));

  const porDepto = {};
  state.pareceres.forEach(p=>{ const l = canonizar(p.departamento); porDepto[l] = (porDepto[l]||0)+1; });

  const porDeptoEmitido = {};
  state.pareceres.filter(p=>p.dataConclusao).forEach(p=>{
    const parecerista = state.pareceristas.find(x=>x.id===parceristaAtualId(p));
    // Sem parecerista individual (ex: "anuência do departamento"), atribui ao departamento do próprio processo,
    // já que quem emitiu, nesse caso, foi o departamento em si.
    const l = canonizar((parecerista && parecerista.departamento) || p.departamento);
    porDeptoEmitido[l] = (porDeptoEmitido[l]||0)+1;
  });

  const todosDeptos = Array.from(mapaCanonico.values())
    .sort((a,b)=> a.localeCompare(b,'pt-BR',{sensitivity:'base'}));

  return { todosDeptos, porDepto, porDeptoEmitido };
}

function montarGraficos(){
  if(!graficosDisponiveis()) return;
  try{
    Object.values(chartInstances).forEach(c=>c && c.destroy());
    chartInstances = {};

    const st = { em_dia:0, atrasado:0, concluido:0 };
    state.pareceres.forEach(p=> st[statusParecer(p)]++);
    const ctxStatus = document.getElementById('chart-status');
    if(ctxStatus){
      chartInstances.status = new Chart(ctxStatus, {
        type:'doughnut',
        data:{ labels:['Em dia','Atrasado','Concluído'], datasets:[{ data:[st.em_dia, st.atrasado, st.concluido], backgroundColor:['#52734F','#9C3B34','#A9752E'] }] },
        options:{ plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } } } }
      });
    }

    const porCategoria = {};
    state.pareceres.forEach(p=>{ const l = labelCategoria(p); porCategoria[l] = (porCategoria[l]||0)+1; });
    const ctxCat = document.getElementById('chart-categoria');
    if(ctxCat){
      chartInstances.categoria = new Chart(ctxCat, {
        type:'bar',
        data:{ labels:Object.keys(porCategoria), datasets:[{ data:Object.values(porCategoria), backgroundColor:'#A9752E' }] },
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } } }
      });
    }

    const { todosDeptos, porDepto, porDeptoEmitido } = calcularDadosDepartamento();

    const ctxDepto = document.getElementById('chart-departamento');
    if(ctxDepto){
      chartInstances.departamento = new Chart(ctxDepto, {
        type:'bar',
        data:{ labels:todosDeptos, datasets:[{ data:todosDeptos.map(d=>porDepto[d]||0), backgroundColor:'#1C2B45' }] },
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } } }
      });
    }

    const ctxDeptoEmitidos = document.getElementById('chart-departamento-emitidos');
    if(ctxDeptoEmitidos){
      chartInstances.departamentoEmitidos = new Chart(ctxDeptoEmitidos, {
        type:'bar',
        data:{ labels:todosDeptos, datasets:[{ data:todosDeptos.map(d=>porDeptoEmitido[d]||0), backgroundColor:'#52734F' }] },
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } } }
      });
    }
  }catch(e){
    console.error('Falha ao montar gráficos do dashboard', e);
  }
}

/* ---------- Modal: novo parecer ---------- */

function abrirModalNovo(){
  if(parceristasAtivos().length === 0){
    abrirModalPareceristas('Cadastre ao menos um parecerista ativo antes de registrar um parecer.');
    return;
  }
  const overlay = criarOverlay();
  const departamentos = departamentosConhecidos();

  const montarOpcoesParecerista = (departamento, autorNUSP, contexto) => {
    contexto = contexto || {};
    const excluir = autorNUSP ? [autorNUSP, ...conflitantesDe(autorNUSP)] : [];
    let ativos = parceristasAtivos().filter(p=> !excluir.includes(p.id));
    if(contexto.apenasComissao) ativos = ativos.filter(p=>p.comissaoPesquisa);
    let continuidade = null;
    if(!TIPOS_SEM_PARECERISTA.includes(contexto.tipoParecer)){
      const anterior = parceristaAnteriorDoProcesso(contexto.ano, contexto.codigo, contexto.categoria);
      if(anterior && ativos.some(p=>p.id===anterior.id)) continuidade = anterior;
    }
    const sugerido = continuidade || (departamento ? sugerirParecerista(departamento, excluir, contexto.apenasComissao) : null);
    const grupo = departamento ? grupoDoDepartamento(departamento) : null;
    if(ativos.length === 0){
      return contexto.apenasComissao ? `<option value="">— nenhum membro da comissão de pesquisa ativo —</option>` : '';
    }
    return ativos.map(p=>{
      const mesmoDepto = departamento && normaliza(p.departamento)===normaliza(departamento);
      const relacionado = !mesmoDepto && grupo && grupo.some(d=>normaliza(d)===normaliza(p.departamento));
      let tag;
      if(continuidade && p.id===continuidade.id) tag = ' — avaliou o parecer inicial deste processo';
      else if(sugerido && p.id===sugerido.id) tag = ' — sugerido';
      else if(mesmoDepto) tag = ' — mesmo departamento';
      else if(relacionado) tag = ' — departamento relacionado';
      else tag = '';
      return `<option value="${p.id}" ${sugerido && p.id===sugerido.id ? 'selected':''}>${escapeHtml(p.nome)} — nº USP ${escapeHtml(p.id)}${tag}</option>`;
    }).join('');
  };

  overlay.innerHTML = `
    <div class="modal">
      <h2>Novo parecer</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-ano">Ano do processo</label>
          <input id="f-ano" type="text" placeholder="2026" maxlength="4">
        </div>
        <div class="field">
          <label for="f-codigo">Código do processo</label>
          <input id="f-codigo" type="text" placeholder="000123">
        </div>
      </div>
      <div class="field">
        <label for="f-autor-nusp">Nº USP do autor avaliado</label>
        <input id="f-autor-nusp" type="text" placeholder="Ex: 1234567">
        <p class="field-hint">Usado para não sugerir esse mesmo parecerista para avaliar seu próprio trabalho e para equilibrar quem já avaliou versus quem já foi avaliado.</p>
      </div>
      <div class="field">
        <label for="f-categoria">Categoria do parecer</label>
        <select id="f-categoria">
          ${CATEGORIAS_PARECER.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="campo-outros" style="display:none;">
        <label for="f-categoria-outros">Especifique a categoria</label>
        <input id="f-categoria-outros" type="text" placeholder="Descreva a categoria">
      </div>
      <div class="field" id="campo-comissao-outros" style="display:none;">
        <label style="display:flex;align-items:center;gap:0.6rem;margin:0;">
          <button type="button" class="toggle" id="f-comissao-outros"></button>
          Avaliar pela comissão de pesquisa
        </label>
        <p class="field-hint">Restringe a sugestão e a seleção de parecerista aos membros da comissão de pesquisa, priorizando departamento relacionado e rodízio entre eles.</p>
      </div>
      <div class="field" id="campo-tipo"></div>
      <div class="field">
        <label for="f-departamento">Departamento vinculado à atividade</label>
        <input id="f-departamento" type="text" list="lista-departamentos" placeholder="Ex: Departamento de Física">
        <datalist id="lista-departamentos">${departamentos.map(d=>`<option value="${escapeHtml(d)}">`).join('')}</datalist>
      </div>
      <div class="field" id="campo-parecerista-wrap">
        <label for="f-parecerista">Parecerista (sugestão automática por departamento, reciprocidade e rotatividade)</label>
        <p class="field-hint" id="aviso-continuidade" style="display:none;color:var(--brass-dark);"></p>
        <select id="f-parecerista">${montarOpcoesParecerista('', '')}</select>
        <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;">
          <input id="f-parecerista-usp" type="text" readonly style="flex:1;background:var(--paper-raised);">
          <button type="button" class="btn-ghost btn-sm" id="copiar-usp-parecerista">Copiar nº USP</button>
        </div>
        <p class="field-hint" id="copiar-usp-status"></p>
      </div>
      <p class="field-hint" id="aviso-sem-parecerista" style="display:none;">Esse tipo de parecer é uma anuência do próprio departamento — não há um parecerista individual a indicar. O prazo continua sendo contado normalmente (14 + 7 dias).</p>
      <div class="field-error" id="err-msg"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelar">Cancelar</button>
        <button class="btn" id="salvar">Registrar</button>
      </div>
    </div>
  `;

  const montarCampoTipo = (categoria) => {
    const opcoes = TIPOS_PARECER[categoria] || [];
    if(opcoes.length > 0){
      return `
        <label for="f-tipo">Tipo de parecer</label>
        <select id="f-tipo">${opcoes.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}</select>
      `;
    }
    return `
      <label for="f-tipo">Tipo de parecer (opcional)</label>
      <input id="f-tipo" type="text" placeholder="Deixe em branco se não se aplicar">
    `;
  };

  const atualizarVisibilidadeParecerista = () => {
    const tipoEl = document.getElementById('f-tipo');
    const tipo = tipoEl ? tipoEl.value : '';
    const semParecerista = TIPOS_SEM_PARECERISTA.includes(tipo);
    document.getElementById('campo-parecerista-wrap').style.display = semParecerista ? 'none' : 'block';
    document.getElementById('aviso-sem-parecerista').style.display = semParecerista ? 'block' : 'none';
  };
  const ligarEventosTipo = () => {
    const tipoEl = document.getElementById('f-tipo');
    if(tipoEl){
      tipoEl.onchange = () => { atualizarVisibilidadeParecerista(); atualizarSugestao(); };
      tipoEl.oninput = () => { atualizarVisibilidadeParecerista(); atualizarSugestao(); };
    }
    atualizarVisibilidadeParecerista();
  };
  const atualizarCampoUsp = () => {
    const id = document.getElementById('f-parecerista').value;
    const p = state.pareceristas.find(x=>x.id===id);
    document.getElementById('f-parecerista-usp').value = p ? `${p.nome} — nº USP ${p.id}` : '';
  };
  const contextoAtual = () => ({
    ano: document.getElementById('f-ano').value.trim(),
    codigo: document.getElementById('f-codigo').value.trim(),
    categoria: document.getElementById('f-categoria').value,
    tipoParecer: (document.getElementById('f-tipo') ? document.getElementById('f-tipo').value.trim() : ''),
    apenasComissao: document.getElementById('f-comissao-outros').classList.contains('on')
  });
  const atualizarSugestao = () => {
    const departamento = document.getElementById('f-departamento').value;
    const autorNUSP = document.getElementById('f-autor-nusp').value.trim();
    const contexto = contextoAtual();
    document.getElementById('f-parecerista').innerHTML = montarOpcoesParecerista(departamento, autorNUSP, contexto);
    atualizarCampoUsp();
    const avisoContinuidade = document.getElementById('aviso-continuidade');
    if(!TIPOS_SEM_PARECERISTA.includes(contexto.tipoParecer)){
      const anterior = parceristaAnteriorDoProcesso(contexto.ano, contexto.codigo, contexto.categoria);
      if(anterior){
        avisoContinuidade.style.display = 'block';
        avisoContinuidade.textContent = `Este processo já foi registrado antes com ${anterior.nome}${anterior.ativo ? ' — mantendo o mesmo parecerista para continuidade.' : ' — porém essa pessoa está inativa no momento, então a sugestão segue o rodízio normal.'}`;
      } else {
        avisoContinuidade.style.display = 'none';
      }
    } else {
      avisoContinuidade.style.display = 'none';
    }
  };
  document.getElementById('f-parecerista').onchange = atualizarCampoUsp;
  document.getElementById('copiar-usp-parecerista').onclick = () => {
    const id = document.getElementById('f-parecerista').value;
    const status = document.getElementById('copiar-usp-status');
    if(!id){ status.textContent = 'Selecione um parecerista primeiro.'; return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(id)
        .then(()=>{ status.style.color='var(--green)'; status.textContent = `Nº USP ${id} copiado.`; })
        .catch(()=>{ status.style.color='var(--ink-soft)'; status.textContent = 'Não foi possível copiar automaticamente — selecione o texto do campo ao lado e copie manualmente.'; });
    } else {
      const campo = document.getElementById('f-parecerista-usp');
      campo.removeAttribute('readonly');
      campo.select();
      status.style.color='var(--ink-soft)';
      status.textContent = 'Texto selecionado — use Ctrl+C (ou Cmd+C) para copiar.';
    }
  };
  document.getElementById('f-comissao-outros').onclick = (e) => {
    e.target.classList.toggle('on');
    atualizarSugestao();
  };
  atualizarCampoUsp();
  document.getElementById('campo-tipo').innerHTML = montarCampoTipo(document.getElementById('f-categoria').value);
  ligarEventosTipo();
  document.getElementById('f-categoria').onchange = (e) => {
    const ehOutros = e.target.value === 'outros';
    document.getElementById('campo-outros').style.display = ehOutros ? 'block' : 'none';
    document.getElementById('campo-comissao-outros').style.display = ehOutros ? 'block' : 'none';
    if(!ehOutros) document.getElementById('f-comissao-outros').classList.remove('on');
    document.getElementById('campo-tipo').innerHTML = montarCampoTipo(e.target.value);
    ligarEventosTipo();
    atualizarSugestao();
  };
  document.getElementById('f-ano').oninput = atualizarSugestao;
  document.getElementById('f-codigo').oninput = atualizarSugestao;
  document.getElementById('f-departamento').oninput = atualizarSugestao;
  document.getElementById('f-autor-nusp').oninput = atualizarSugestao;
  document.getElementById('cancelar').onclick = fecharOverlay;
  document.getElementById('salvar').onclick = () => {
    const ano = document.getElementById('f-ano').value.trim();
    const codigo = document.getElementById('f-codigo').value.trim();
    const autorNUSP = document.getElementById('f-autor-nusp').value.trim();
    const categoria = document.getElementById('f-categoria').value;
    const categoriaOutros = document.getElementById('f-categoria-outros').value.trim();
    const avaliadoPelaComissao = categoria==='outros' && document.getElementById('f-comissao-outros').classList.contains('on');
    const tipoParecer = document.getElementById('f-tipo').value.trim();
    const departamento = canonicalizarDepartamentoDigitado(document.getElementById('f-departamento').value.trim());
    const semParecerista = TIPOS_SEM_PARECERISTA.includes(tipoParecer);
    const parceristaId = semParecerista ? '' : document.getElementById('f-parecerista').value;

    if(!ano || !codigo){ document.getElementById('err-msg').textContent = 'Informe o ano e o código do processo.'; return; }
    if(categoria==='outros' && !categoriaOutros){ document.getElementById('err-msg').textContent = 'Descreva a categoria do parecer.'; return; }
    if((TIPOS_PARECER[categoria]||[]).length > 0 && !tipoParecer){ document.getElementById('err-msg').textContent = 'Selecione o tipo de parecer.'; return; }
    if(!departamento){ document.getElementById('err-msg').textContent = 'Informe o departamento vinculado.'; return; }
    if(!semParecerista){
      if(!parceristaId){ document.getElementById('err-msg').textContent = 'Selecione um parecerista.'; return; }
      if(autorNUSP && (parceristaId===autorNUSP || conflitantesDe(autorNUSP).includes(parceristaId))){ document.getElementById('err-msg').textContent = 'Esse parecerista está em conflito de interesse com o autor avaliado.'; return; }
    }

    const hoje = todayIso();
    const novo = {
      id: uid(),
      numero: state.proximoNumero,
      processoAno: ano,
      processoCodigo: codigo,
      autorNUSP,
      categoriaParecer: categoria,
      categoriaParecerOutros: categoria==='outros' ? categoriaOutros : '',
      avaliadoPelaComissao,
      tipoParecer,
      departamento,
      atribuicoes: semParecerista ? [] : [{ parceristaId, data: hoje }],
      dataSolicitacaoAtual: hoje,
      faseAtual: 1,
      prazoFase1: calcularPrazo(hoje, 14),
      prazoFase2: null,
      emailEnviadoFase1: false,
      dataConclusao: null,
      historicoDecisoes: []
    };
    state.pareceres.push(novo);
    state.proximoNumero += 1;
    saveState();
    fecharOverlay();
    flashMsg = `Parecer nº ${pad(novo.numero)} registrado. Prazo inicial: ${fmtDate(novo.prazoFase1)}.`;
    render();
  };
}

    const cont = document.getElementById('msub-conteudo');

      <div id="importar-preview"></div>

      const file = e.target.files[0];

      if(typeof XLSX === 'undefined'){
        document.getElementById('importar-preview').innerHTML = `<p class="field-error">Não foi possível carregar a biblioteca de leitura de planilhas (a rede pode estar bloqueando recursos externos). Verifique sua conexão com a internet e recarregue a página.</p>`;
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
          const parsed = rows.map(r => parseLinhaParecerista(r)).filter(Boolean);
          mostrarPreviewImportacao(parsed);
        }catch(err){
          document.getElementById('importar-preview').innerHTML = `<p class="field-error">Não foi possível ler o arquivo. Verifique se é um .xlsx, .xls ou .csv válido.</p>`;
        }
      };
      reader.readAsArrayBuffer(file);
    };
  };

  const mostrarPreviewImportacao = (parsed) => {
    const box = document.getElementById('importar-preview');
    if(parsed.length === 0){
      box.innerHTML = `<p class="field-error">Nenhuma linha reconhecida. Confira se a planilha tem cabeçalhos como "nº USP", "nome", "e-mail", "departamento" e "categoria".</p>`;

    }
    box.innerHTML = `
      <div class="import-preview">
        <strong>${parsed.length} parecerista(s) encontrado(s):</strong>
        ${parsed.slice(0,8).map(p=>`<div>${escapeHtml(p.nome)} — ${escapeHtml(p.departamento||'sem depto.')}</div>`).join('')}

      </div>
      <button class="btn" id="confirmar-importacao">Importar ${parsed.length} parecerista(s)</button>
    `;
    document.getElementById('confirmar-importacao').onclick = () => {
      let novos = 0, atualizados = 0;
      parsed.forEach(p=>{
        const existente = state.pareceristas.find(x=>x.id===p.id);
        if(existente){
          Object.assign(existente, p, { ativo: existente.ativo });
          atualizados++;
        } else {
          state.pareceristas.push(p);
          novos++;
        }
      });
      ordenarPareceristasAlfabeticamente();
      saveState();
      aviso = null;
      subaba = 'lista';
      flashMsg = `Importação concluída: ${novos} novo(s), ${atualizados} atualizado(s).`;
      desenhar();
    };
  };

  desenhar();
}

function normalizarCategoriaParecerista(raw){
  const n = normaliza(raw);
  if(!n) return '';
  const posdoc = ['pos-doutorando','pos doutorando','posdoc','pos-doc','pos doc','pos-doutor','pos doutor'];
  if(posdoc.some(p => n.includes(p))) return 'Pós-doutorando';
  if(n.includes('colaborador')) return 'Pesquisador colaborador';
  if(n.includes('externo')) return 'Externo';
  const docente = ['docente','professor','prof.','prof ','doutor','associado','titular','adjunto','livre-docente','livre docente'];
  if(docente.some(p => n.includes(p))) return 'Docente';
  return raw.trim();
}

function parseLinhaParecerista(row){
  const chaves = Object.keys(row);
  const acha = (padroes) => {
    const k = chaves.find(c => padroes.some(p => normaliza(c).includes(p)));
    return k ? String(row[k]).trim() : '';
  };
  const nUSP = acha(['nusp','n usp','usp','matricula','id']);
  const nome = acha(['nome']);
  const email = acha(['mail']);
  const departamento = canonicalizarDepartamentoDigitado(acha(['depart']));
  const categoria = normalizarCategoriaParecerista(acha(['categ','funcao','vinculo','cargo']));
  const comissaoTexto = normaliza(acha(['comissao']));
  const comissaoPesquisa = ['sim','x','s','yes','true','1'].includes(comissaoTexto);
  const staffTexto = normaliza(acha(['staff']));
  const staff = ['sim','x','s','yes','true','1'].includes(staffTexto);
  if(!nome) return null;
  return { id: nUSP || uid(), nome, email, departamento, categoria, comissaoPesquisa, staff, ativo:true };
}

      </div>
    `;
    document.getElementById('s-vps-ativo').onclick = (e) => { e.target.classList.toggle('on'); };
    const capturar = () => {
      syncConfig.vps.url = document.getElementById('s-vps-url').value.trim();
      syncConfig.vps.token = document.getElementById('s-vps-token').value.trim();
      syncConfig.vps.ativo = document.getElementById('s-vps-ativo').classList.contains('on');
      salvarSyncConfig();
    };
    document.getElementById('s-vps-salvar').onclick = () => { capturar(); document.getElementById('s-vps-erro').style.color='var(--green)'; document.getElementById('s-vps-erro').textContent='Configuração salva.'; };
    document.getElementById('s-vps-agora').onclick = async () => {
      capturar();
      document.getElementById('s-vps-erro').style.color='var(--ink-soft)';
      document.getElementById('s-vps-erro').textContent = 'Enviando backup…';
      try{ await backupVPS(); document.getElementById('s-vps-erro').style.color='var(--green)'; document.getElementById('s-vps-erro').textContent = 'Backup enviado com sucesso.'; }
      catch(e){ document.getElementById('s-vps-erro').style.color='var(--red)'; document.getElementById('s-vps-erro').textContent = e.message; }
    };
    document.getElementById('s-vps-restaurar').onclick = async () => {
      capturar();
      document.getElementById('s-vps-erro').style.color='var(--ink-soft)';
      document.getElementById('s-vps-erro').textContent = 'Restaurando…';
      try{ await restaurarVPS(); flashMsg = 'Dados restaurados do servidor.'; fecharOverlay(); render(); }
      catch(e){ document.getElementById('s-vps-erro').style.color='var(--red)'; document.getElementById('s-vps-erro').textContent = e.message; }
    };
  };

  const desenharArquivo = () => {
    const cont = document.getElementById('ssub-conteudo');
    cont.innerHTML = `
      <p class="field-hint" style="margin-bottom:0.8rem;">
        Baixe um arquivo .json com todos os dados. Se salvar esse arquivo dentro de uma pasta sincronizada do Google Drive, OneDrive ou Dropbox no seu computador, ele vira um backup automático sem precisar configurar nada.
      </p>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn-ghost btn-sm" id="s-exportar">Exportar backup (.json)</button>
      </div>
      <div class="field" style="margin-top:1rem;">
        <label for="s-importar">Restaurar de um arquivo</label>
        <input id="s-importar" type="file" accept=".json">
      </div>
    `;
    document.getElementById('s-exportar').onclick = exportarArquivo;
    document.getElementById('s-importar').onchange = (e) => {
      const file = e.target.files[0];
      if(file) importarArquivo(file);
      fecharOverlay();
    };
  };

  desenhar();
}

/* ---------- Modal: departamentos ---------- */

function abrirModalDepartamentos(){
  const overlay = criarOverlay();
  const desenhar = () => {
    const doPareceristas = new Set();
    state.pareceristas.forEach(p=>{ if(p.departamento) doPareceristas.add(normaliza(p.departamento)); });
    const extras = state.departamentosExtras || [];
    const todos = departamentosConhecidos();
    overlay.innerHTML = `
      <div class="modal">
        <h2>Departamentos</h2>
        <p class="field-hint" style="margin-bottom:1rem;">
          Esta lista alimenta as sugestões automáticas nos campos de "departamento vinculado" e nos grupos. Departamentos usados por algum parecerista cadastrado aparecem aqui sozinhos; para incluir outros (ex: administrativos, ou que ainda não têm parecerista) adicione manualmente abaixo.
        </p>
        <div class="list-scroll">
          ${todos.map(d=>{
            const ehExtra = extras.some(e=>normaliza(e)===normaliza(d));
            const emUsoPorParecerista = doPareceristas.has(normaliza(d));
            return `
              <div class="parecerista-row">
                <span>${escapeHtml(d)}${!emUsoPorParecerista ? ' <span class="muted">— adicionado manualmente</span>' : ''}</span>
                ${ehExtra && !emUsoPorParecerista ? `<button class="icon-btn danger" data-del-depto="${escapeHtml(d)}" aria-label="Remover ${escapeHtml(d)}" title="Remover">✕</button>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <div class="add-parecerista" style="margin-top:1rem;">
          <input id="f-novo-depto" type="text" placeholder="Ex: ADM">
          <button class="btn btn-sm" id="add-depto">Adicionar</button>
        </div>
        <div class="field-error" id="err-depto"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn-ghost btn-sm" id="padronizar-deptos">Padronizar grafia nos pareceres já cadastrados</button>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" id="fechar-deptos">Fechar</button>
        </div>
      </div>
    `;
    document.getElementById('fechar-deptos').onclick = () => { fecharOverlay(); render(); };
    document.getElementById('padronizar-deptos').onclick = () => {
      const alterados = padronizarGrafiaDepartamentosExistentes();
      saveState();
      const erro = document.getElementById('err-depto');
      erro.style.color = 'var(--green)';
      erro.textContent = alterados > 0 ? `${alterados} parecer(es) tiveram o departamento padronizado.` : 'Nenhum parecer precisava de ajuste.';
    };
    document.querySelectorAll('[data-del-depto]').forEach(el=>{
      el.onclick = () => {
        const d = el.dataset.delDepto;
        state.departamentosExtras = (state.departamentosExtras||[]).filter(x=>normaliza(x)!==normaliza(d));
        saveState();
        desenhar();
      };
    });
    document.getElementById('add-depto').onclick = () => {
      const val = document.getElementById('f-novo-depto').value.trim();
      const erro = document.getElementById('err-depto');
      erro.textContent = '';
      if(!val){ erro.textContent = 'Digite um nome de departamento.'; return; }
      if(departamentosConhecidos().some(d=>normaliza(d)===normaliza(val))){ erro.textContent = 'Esse departamento já está na lista.'; return; }
      state.departamentosExtras = state.departamentosExtras || [];
      state.departamentosExtras.push(val);
      saveState();
      desenhar();
    };
  };
  desenhar();
}

/* ---------- Modal: feriados ---------- */

function abrirModalFeriados(){
  const overlay = criarOverlay();
  const desenhar = () => {
    const anoAtual = Number(todayIso().slice(0,4));
    const nacionais = [anoAtual, anoAtual+1]
      .flatMap(ano => feriadosNacionaisDoAno(ano).map(data=>({data, origem:'nacional/SP'})))
      .sort((a,b)=>a.data.localeCompare(b.data));
    const extras = (state.feriadosExtras||[]).slice().sort((a,b)=>a.data.localeCompare(b.data));

    overlay.innerHTML = `
      <div class="modal modal-wide">
        <h2>Feriados</h2>
        <p class="field-hint" style="margin-bottom:1rem;">
          Prazos que vencem em fim de semana ou feriado são automaticamente empurrados para o próximo dia útil. Feriados nacionais e o estadual de SP (9 de julho) já são calculados sozinhos, inclusive os móveis (Carnaval, Sexta-feira Santa, Corpus Christi). Cadastre aqui outros que também devem valer — ponto facultativo, feriado municipal, recesso da USP etc.
        </p>
        <p style="font-size:0.78rem;color:var(--ink-soft);margin:0 0 0.4rem;">Calculados automaticamente (${anoAtual} e ${anoAtual+1}):</p>
        <div class="list-scroll" style="max-height:140px;margin-bottom:1rem;">
          ${nacionais.map(f=>`<div class="parecerista-row"><span>${fmtDate(f.data)} <span class="muted">— ${escapeHtml(f.data)}</span></span></div>`).join('')}
        </div>
        <p style="font-size:0.78rem;color:var(--ink-soft);margin:0 0 0.4rem;">Cadastrados manualmente:</p>
        ${extras.length ? `
          <div class="list-scroll" style="max-height:160px;">
            ${extras.map((f,i)=>`
              <div class="parecerista-row">
                <span>${fmtDate(f.data)} — ${escapeHtml(f.descricao||'sem descrição')}</span>
                <button class="icon-btn danger" data-del-feriado="${i}" aria-label="Remover feriado" title="Remover">✕</button>
              </div>
            `).join('')}
          </div>
        ` : `<p class="field-hint">Nenhum feriado adicional cadastrado.</p>`}
        <div class="field-row" style="margin-top:1rem;">
          <div class="field"><label for="f-feriado-data">Data</label><input id="f-feriado-data" type="date"></div>
          <div class="field"><label for="f-feriado-desc">Descrição</label><input id="f-feriado-desc" type="text" placeholder="Ex: Recesso da USP"></div>
        </div>
        <div class="field-error" id="err-feriado"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn-ghost btn-sm" id="add-feriado">Adicionar feriado</button>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" id="fechar-feriados">Fechar</button>
        </div>
      </div>
    `;
    document.getElementById('fechar-feriados').onclick = () => { fecharOverlay(); render(); };
    document.querySelectorAll('[data-del-feriado]').forEach(el=>{
      el.onclick = () => {
        state.feriadosExtras.splice(Number(el.dataset.delFeriado), 1);
        saveState();
        desenhar();
      };
    });
    document.getElementById('add-feriado').onclick = () => {
      const data = document.getElementById('f-feriado-data').value;
      const descricao = document.getElementById('f-feriado-desc').value.trim();
      const erro = document.getElementById('err-feriado');
      erro.textContent = '';
      if(!data){ erro.textContent = 'Selecione uma data.'; return; }
      state.feriadosExtras = state.feriadosExtras || [];
      if(state.feriadosExtras.some(f=>f.data===data)){ erro.textContent = 'Essa data já está cadastrada.'; return; }
      state.feriadosExtras.push({ data, descricao });
      saveState();
      desenhar();
    };
  };
  desenhar();
}

/* ---------- Modal: grupos de departamentos ---------- */

function abrirModalGrupos(){
  const overlay = criarOverlay();
  const desenhar = () => {
    const grupos = state.gruposDepartamentos || [];
    overlay.innerHTML = `
      <div class="modal">
        <h2>Grupos de departamentos</h2>
        <p class="field-hint" style="margin-bottom:1rem;">
          Departamentos no mesmo grupo têm atividades relacionadas. A sugestão automática de parecerista nunca indica alguém do mesmo departamento do processo, mas, dentro dos demais, prioriza quem for de um departamento do mesmo grupo antes de considerar os outros.
          Ex: se ZEA, ZEB e ZAB formam um grupo, um processo do ZEA prioriza pareceristas do ZEB/ZAB antes de ir para departamentos fora do grupo.
        </p>
        ${grupos.length ? `
          <div class="list-scroll">
            ${grupos.map((g,i)=>`
              <div class="parecerista-row">
                <span class="name">${g.map(d=>escapeHtml(d)).join(' · ')}</span>
                <button class="icon-btn danger" data-del-grupo="${i}" aria-label="Remover grupo" title="Remover grupo">✕</button>
              </div>
            `).join('')}
          </div>
        ` : `<p class="field-hint">Nenhum grupo cadastrado ainda.</p>`}
        <div class="add-parecerista" style="margin-top:1rem;">
          <input id="f-novo-grupo" type="text" placeholder="Ex: ZEA, ZEB, ZAB">
          <button class="btn btn-sm" id="add-grupo">Adicionar grupo</button>
        </div>
        <p class="field-hint">Separe os departamentos por vírgula. Use as mesmas siglas/nomes cadastrados nos pareceristas.</p>
        <div class="field-error" id="err-grupo"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="fechar-grupos">Fechar</button>
        </div>
      </div>
    `;
    document.getElementById('fechar-grupos').onclick = () => { fecharOverlay(); render(); };
    document.querySelectorAll('[data-del-grupo]').forEach(el=>{
      el.onclick = () => {
        state.gruposDepartamentos.splice(Number(el.dataset.delGrupo), 1);
        saveState();
        desenhar();
      };
    });
    document.getElementById('add-grupo').onclick = () => {
      const raw = document.getElementById('f-novo-grupo').value;
      const deptos = raw.split(',').map(s=>s.trim()).filter(Boolean);
      const erro = document.getElementById('err-grupo');
      erro.textContent = '';
      if(deptos.length < 2){ erro.textContent = 'Informe pelo menos dois departamentos separados por vírgula.'; return; }
      state.gruposDepartamentos = state.gruposDepartamentos || [];
      state.gruposDepartamentos.push(deptos);
      saveState();
      desenhar();
    };
  };
  desenhar();
}

/* ---------- Modal: conflitos de interesse ---------- */

function abrirModalConflitos(){
  const overlay = criarOverlay();
  const desenhar = () => {
    const grupos = state.gruposConflito || [];
    const checkboxes = state.pareceristas.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`
      <label style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0.2rem;font-size:0.83rem;">
        <input type="checkbox" class="conflito-check" value="${p.id}">
        ${escapeHtml(p.nome)} <span class="muted">(${escapeHtml(p.departamento||'sem depto.')})</span>
      </label>
    `).join('');
    overlay.innerHTML = `
      <div class="modal modal-wide">
        <h2>Conflitos de interesse</h2>
        <p class="field-hint" style="margin-bottom:1rem;">
          Pareceristas no mesmo grupo de conflito nunca são sugeridos, nem podem ser selecionados manualmente, para avaliar um parecer cujo "nº USP do autor avaliado" seja de outro integrante do mesmo grupo. Use para cônjuges, coautores frequentes, orientador-orientando, familiares etc.
        </p>
        ${grupos.length ? `
          <div class="list-scroll">
            ${grupos.map((g,i)=>`
              <div class="parecerista-row">
                <span class="name">${g.map(id=>escapeHtml(nomeParecerista(id))).join(' ↔ ')}</span>
                <button class="icon-btn danger" data-del-conflito="${i}" aria-label="Remover grupo" title="Remover grupo">✕</button>
              </div>
            `).join('')}
          </div>
        ` : `<p class="field-hint">Nenhum grupo de conflito cadastrado ainda.</p>`}
        <div style="margin-top:1rem;">
          <label style="font-size:0.78rem;color:var(--ink-soft);display:block;margin-bottom:0.4rem;">Marque os pareceristas que estão em conflito entre si</label>
          ${state.pareceristas.length ? `
            <div class="list-scroll mini-table-wrap" style="max-height:220px;border:1px solid var(--line);border-radius:8px;padding:0.3rem 0.9rem;">
              ${checkboxes}
            </div>
          ` : `<p class="field-hint">Cadastre pareceristas primeiro, em "Pareceristas".</p>`}
        </div>
        <div class="field-error" id="err-conflito" style="margin-top:0.6rem;"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn-ghost btn-sm" id="add-conflito">Criar grupo de conflito</button>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" id="fechar-conflitos">Fechar</button>
        </div>
      </div>
    `;
    document.getElementById('fechar-conflitos').onclick = () => { fecharOverlay(); render(); };
    document.querySelectorAll('[data-del-conflito]').forEach(el=>{
      el.onclick = () => {
        state.gruposConflito.splice(Number(el.dataset.delConflito), 1);
        saveState();
        desenhar();
      };
    });
    const btnAdd = document.getElementById('add-conflito');
    if(btnAdd){
      btnAdd.onclick = () => {
        const marcados = Array.from(document.querySelectorAll('.conflito-check:checked')).map(el=>el.value);
        const erro = document.getElementById('err-conflito');
        erro.textContent = '';
        if(marcados.length < 2){ erro.textContent = 'Selecione pelo menos dois pareceristas.'; return; }
        state.gruposConflito = state.gruposConflito || [];
        state.gruposConflito.push(marcados);
        saveState();
        desenhar();
      };
    }
  };
  desenhar();
}


/* ---------- Modal: declaração de pareceres emitidos ---------- */

function abrirModalDeclaracao(){
  const overlay = criarOverlay();
  const desenhar = () => {
    const pareceristasOrdenados = state.pareceristas.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));
    overlay.innerHTML = `
      <div class="modal">
        <h2>Gerar declaração</h2>
        <p class="field-hint" style="margin-bottom:1rem;">
          Monta um texto de declaração com a quantidade de pareceres emitidos por um parecerista num período, agrupados por categoria e tipo de parecer — sem citar números de processo.
        </p>
        <div class="field">
          <label for="f-decl-parecerista">Parecerista</label>
          <select id="f-decl-parecerista">
            <option value="">Selecione...</option>
            ${pareceristasOrdenados.map(p=>`<option value="${p.id}">${escapeHtml(p.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-decl-inicio">Período — de</label><input id="f-decl-inicio" type="date" max="${todayIso()}"></div>
          <div class="field"><label for="f-decl-fim">até</label><input id="f-decl-fim" type="date" max="${todayIso()}"></div>
        </div>
        <p class="field-hint">O período considera a data em que o parecer foi solicitado a essa pessoa (não a data de conclusão), e só entram pareceres já concluídos.</p>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn-ghost btn-sm" id="gerar-declaracao">Gerar declaração</button>
        </div>
        <div id="resultado-declaracao"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="fechar-declaracao">Fechar</button>
        </div>
      </div>
    `;
    document.getElementById('fechar-declaracao').onclick = () => { fecharOverlay(); render(); };
    document.getElementById('gerar-declaracao').onclick = () => {
      const parceristaId = document.getElementById('f-decl-parecerista').value;
      const inicio = document.getElementById('f-decl-inicio').value;
      const fim = document.getElementById('f-decl-fim').value;
      const resultadoEl = document.getElementById('resultado-declaracao');

      if(!parceristaId){ resultadoEl.innerHTML = `<p class="field-error">Selecione um parecerista.</p>`; return; }
      if(!inicio || !fim){ resultadoEl.innerHTML = `<p class="field-error">Informe o período (data inicial e final).</p>`; return; }
      if(inicio > fim){ resultadoEl.innerHTML = `<p class="field-error">A data inicial não pode ser depois da data final.</p>`; return; }
      if(fim > todayIso()){ resultadoEl.innerHTML = `<p class="field-error">A data final não pode ser depois de hoje (${fmtDate(todayIso())}).</p>`; return; }

      const parecerista = state.pareceristas.find(x=>x.id===parceristaId);
      const pareceresDoPeriodo = state.pareceres.filter(p=>
        p.dataConclusao &&
        parceristaAtualId(p) === parceristaId &&
        p.dataSolicitacaoAtual >= inicio && p.dataSolicitacaoAtual <= fim
      );

      if(pareceresDoPeriodo.length === 0){
        resultadoEl.innerHTML = `<p class="field-hint">Nenhum parecer emitido por ${escapeHtml(parecerista.nome)} nesse período (considerando a data de solicitação).</p>`;
        return;
      }

      const grupos = {};
      pareceresDoPeriodo.forEach(p=>{
        const chave = labelCategoria(p) + (p.tipoParecer ? ' — ' + p.tipoParecer : '');
        grupos[chave] = (grupos[chave]||0) + 1;
      });
      const linhasGrupos = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(k=>`- ${k}: ${grupos[k]}`).join('\n');

      const texto =
`DECLARAÇÃO

Declaramos, para os devidos fins, que ${parecerista.nome}, nº USP ${parecerista.id}, emitiu, no período de ${fmtDate(inicio)} a ${fmtDate(fim)}, um total de ${pareceresDoPeriodo.length} parecer(es) no âmbito da Comissão de Pesquisa e Inovação da Faculdade de Zootecnia e Engenharia de Alimentos (FZEA/USP), assim discriminados:

${linhasGrupos}

Pirassununga, ${fmtDataPorExtenso(todayIso())}.


Comissão de Pesquisa e Inovação
FZEA/USP`;

      resultadoEl.innerHTML = `
        <div class="field">
          <label>Texto da declaração</label>
          <textarea id="f-texto-declaracao" rows="16">${escapeHtml(texto)}</textarea>
          <div style="display:flex;justify-content:flex-end;margin-top:0.4rem;">
            <button type="button" class="btn-ghost btn-sm" data-copiar="f-texto-declaracao" data-status="status-declaracao">Copiar declaração</button>
          </div>
          <p class="field-hint" id="status-declaracao"></p>
        </div>
      `;
      ligarBotoesCopiar(overlay);
    };
  };
  desenhar();
}

    <div class="modal">
      <h2>Modelo de e-mail</h2>
      <p class="field-hint" style="margin-bottom:0.8rem;">Use os campos entre chaves: {parecerista}, {processo}, {categoria}, {tipo}, {departamento}, {numero_parecer}, {novo_prazo}.</p>

/* ---------- Overlay helpers ---------- */

function criarOverlay(){
  let overlay = document.getElementById('overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'overlay';
    overlay.className = 'overlay';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) fecharOverlay(); });
  }
  overlay.classList.add('open');
  return overlay;
}
function fecharOverlay(){ const overlay = document.getElementById('overlay'); if(overlay) overlay.classList.remove('open'); }

loadState();
